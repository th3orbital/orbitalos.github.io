<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#7cf7ff;
    --accent:#8b5cff;
    --soft:rgba(124,247,255,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

/* 🌌 SPACE BACKGROUND */
body{
    height:100vh;
    overflow:hidden;
    color:white;
    background:#000;
}

/* CANVAS */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:opacity 0.6s ease;
}

#boot h1{
    font-weight:100;
    letter-spacing:22px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%) contrast(1.2);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    color:var(--main);
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:16px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
    backdrop-filter: blur(10px);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
}

.dock-label{
    font-size:10px;
    color:var(--main);
    opacity:0.7;
    position:absolute;
    bottom:-14px;
}

/* ICONS */
.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
    filter: drop-shadow(0 0 8px rgba(124,247,255,0.4));
    transition:0.2s;
}

.dock-app:hover svg{
    transform:scale(1.15);
    filter: drop-shadow(0 0 14px rgba(139,92,255,0.8));
}

/* WINDOWS */
.window{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(5,5,15,0.85);
    backdrop-filter: blur(18px);
    transform:scale(0.85);
    opacity:0;
    transition:0.25s ease;
}

.window.open{
    transform:scale(1);
    opacity:1;
}

.windowTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:12px;
    border-bottom:1px solid var(--soft);
    color:var(--main);
}

.closeBtn{
    color:var(--accent);
    cursor:pointer;
}

/* PROXY */
.windowBar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--soft);
}

.windowBar input{
    flex:1;
    padding:8px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
}

.windowBar button{
    padding:8px 12px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* SETTINGS */
.settingsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:12px;
}

.card{
    padding:12px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    gap:8px;
    color:var(--main);
}

.card input{
    padding:8px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
}

.card button{
    padding:6px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* CONTAINERS */
#proxyApp, #settingsApp{
    position:fixed;
    inset:0;
    display:none;
    z-index:2000;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">

        <div class="dock-app" onclick="openProxy()">
            🌐
            <div class="dock-label">Proxy</div>
        </div>

        <div class="dock-app" onclick="openSettings()">
            ⚙️
            <div class="dock-label">Settings</div>
        </div>

    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">
    <div class="window" id="proxyWindow">

        <div class="windowTop">
            <div>Orbital Proxy</div>
            <div class="closeBtn" onclick="closeProxy()">✕</div>
        </div>

        <div class="windowBar">
            <input id="proxyUrl" placeholder="Search or URL">
            <button onclick="goProxy()">Go</button>
        </div>

        <iframe id="proxyFrame"></iframe>

    </div>
</div>

<!-- SETTINGS -->
<div id="settingsApp">
    <div class="window" id="settingsWindow">

        <div class="windowTop">
            <div>Settings</div>
            <div class="closeBtn" onclick="closeSettings()">✕</div>
        </div>

        <div class="settingsGrid">

            <div class="card">
                <h3>Tab Name</h3>
                <input id="tabName">
                <button onclick="applyDisguise()">Apply</button>
            </div>

            <div class="card">
                <h3>Redirect (\ key)</h3>
                <input id="redirectUrl">
            </div>

        </div>

    </div>
</div>

<script>

/* ENTER FIX */
document.getElementById("enter").onclick=()=>{
    boot.style.opacity="0";
    setTimeout(()=>{
        boot.style.display="none";
        desktop.style.opacity="1";
        video.style.display="block";
        video.play();
    },600);
};

/* VIDEO END */
video.onended=()=>{
    video.style.display="none";
    desktop.style.opacity="1";
};

/* 🌌 SPACE ENGINE */
const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let stars=[];
let shooting=[];

for(let i=0;i<160;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        z:Math.random()*2+0.2
    });
}

document.addEventListener("mousemove",(e)=>{
    mouseX=(e.clientX-canvas.width/2)*0.002;
    mouseY=(e.clientY-canvas.height/2)*0.002;
});

let mouseX=0,mouseY=0;

function spawn(){
    shooting.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height/2,
        vx:6+Math.random()*4,
        vy:2+Math.random()*2,
        life:60
    });
}
setInterval(spawn,2500);

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let s of stars){
        let px=s.x+mouseX*50*s.z;
        let py=s.y+mouseY*50*s.z;

        ctx.fillStyle="#7cf7ff";
        ctx.globalAlpha=0.6;
        ctx.fillRect(px,py,1.5*s.z,1.5*s.z);
    }

    for(let i=shooting.length-1;i>=0;i--){
        let s=shooting[i];

        ctx.globalAlpha=s.life/60;
        ctx.strokeStyle="#8b5cff";
        ctx.beginPath();
        ctx.moveTo(s.x,s.y);
        ctx.lineTo(s.x-s.vx*3,s.y-s.vy*3);
        ctx.stroke();

        s.x+=s.vx;
        s.y+=s.vy;
        s.life--;

        if(s.life<=0) shooting.splice(i,1);
    }

    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
}
draw();

/* CLOCK */
setInterval(()=>{
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    time.innerText=`${h}:${m}`;
    nav.innerText=`${h}:${m}`;
},1000);

/* APPS */
function openProxy(){proxyApp.style.display="block";setTimeout(()=>proxyWindow.classList.add("open"),10);proxyFrame.src="https://google.com";}
function closeProxy(){proxyWindow.classList.remove("open");setTimeout(()=>proxyApp.style.display="none",200);}
function goProxy(){let q=proxyUrl.value;if(!q)return;proxyFrame.src=q.includes(".")?q:"https://google.com/search?q="+q;}

function openSettings(){settingsApp.style.display="block";setTimeout(()=>settingsWindow.classList.add("open"),10);}
function closeSettings(){settingsWindow.classList.remove("open");setTimeout(()=>settingsApp.style.display="none",200);}
function applyDisguise(){if(tabName.value)document.title=tabName.value;}

/* KEYBINDS */
let state=0;

document.addEventListener("keydown",(e)=>{
    if(e.key==="\\"){
        state=(state+1)%3;
        if(state===0){closeProxy();closeSettings();}
        if(state===1){openProxy();closeSettings();}
        if(state===2){openSettings();closeProxy();}
    }
});
</script>

</body>
</html>
