<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#7cf7ff;
    --accent:#8b5cff;
    --soft:rgba(124,247,255,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* 🌌 BACKGROUND */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* ⚠️ DISCLAIMER */
#disclaimer{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.88);
    z-index:9999;

    opacity:0;
    animation:fadeIn 0.35s ease forwards;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.75);
    backdrop-filter: blur(14px);
    text-align:center;
    color:var(--main);

    transform:scale(0.7);
    opacity:0;
    animation:popIn 0.45s ease forwards;
}

.discBox h2{
    font-weight:100;
    letter-spacing:2px;
    margin-bottom:10px;
    animation:glow 2s infinite alternate;
}

.discBox p{
    font-size:12px;
    opacity:0.85;
    line-height:1.5;
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{0%{transform:scale(0.6);opacity:0;}70%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes glow{from{text-shadow:0 0 6px rgba(124,247,255,0.2);}to{text-shadow:0 0 14px rgba(124,247,255,0.7);}}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:opacity 0.7s ease;
}

#boot h1{
    font-weight:100;
    letter-spacing:22px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    color:var(--main);
    font-size:12px;
    cursor:pointer;
}

/* 🎬 VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    background:black;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    color:var(--main);
}

/* WIDGETS */
#widgets{
    position:absolute;
    left:20px;
    top:80px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:260px;
}

.widget{
    padding:12px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--soft);
    backdrop-filter: blur(12px);
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

.wTitle{
    font-size:10px;
    opacity:0.7;
    margin-bottom:6px;
    letter-spacing:2px;
    color:var(--main);
}

.wText{
    font-size:12px;
    opacity:0.85;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
    filter: drop-shadow(0 0 8px rgba(124,247,255,0.4));
}

/* BACKGROUND */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<!-- ⚠️ DISCLAIMER -->
<div id="disclaimer">
    <div class="discBox">
        <h2>SYSTEM WARNING</h2>
        <p>
            This site could be blocked at any time.<br><br>
            Join the DC so you don’t miss out — DC not made yet.<br><br>
            Use at your own risk — and have fun.
        </p>
        <button onclick="accept()">I Understand</button>
    </div>
</div>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- 🎬 MP4 VIDEO -->
<video id="video" muted playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="widgets">
        <div class="widget">
            <div class="wTitle">SYSTEM</div>
            <div class="wText" id="sysStatus"></div>
        </div>

        <div class="widget">
            <div class="wTitle">SIGNAL</div>
            <div class="wText" id="signal"></div>
        </div>

        <div class="widget">
            <div class="wTitle">QUOTE</div>
            <div class="wText" id="quote"></div>
        </div>
    </div>

    <div id="dock">
        <div class="dock-app">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c3 4 3 14 0 18"></path>
            </svg>
        </div>
    </div>

</div>

<script>

/* DISCLAIMER */
function accept(){
    document.getElementById("disclaimer").style.display="none";
    document.getElementById("boot").style.display="flex";
}

/* ENTER */
document.getElementById("enter").onclick=()=>{
    boot.style.opacity="0";

    setTimeout(()=>{
        boot.style.display="none";
        desktop.style.opacity="1";

        let v=document.getElementById("video");
        v.style.display="block";
        v.play();

    },700);
};

/* TEXT */
quote.innerText="Orbit beyond limits.";
sysStatus.innerText="ONLINE";
signal.innerText="CLEAR";

</script>

</body>
</html>
