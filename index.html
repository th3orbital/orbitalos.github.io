<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbital OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05060a;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --accent:#a855f7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:var(--bg);
  overflow:hidden;
  color:white;
}

/* 🌌 STAR BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* 🍎 TOP BAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  height:32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  background:var(--glass);
  backdrop-filter: blur(12px);
  border-bottom:1px solid var(--border);
  font-size:12px;
}

/* DESKTOP */
#desktop{
  position:fixed;
  inset:0;
  display:none;
}

/* DOCK (MAC STYLE) */
.dock{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  padding:10px 14px;
  background:var(--glass);
  backdrop-filter: blur(18px);
  border:1px solid var(--border);
  border-radius:18px;
}

.icon{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.2s;
}

.icon:hover{
  transform:scale(1.2);
}

/* WINDOWS (FULLSCREEN APPS) */
.window{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:rgba(10,10,20,0.9);
  backdrop-filter: blur(20px);
}

/* WINDOW TOP BAR */
.wbar{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid var(--border);
}

.close{
  cursor:pointer;
  font-size:14px;
  color:#ff5f5f;
}

/* CONTENT */
.content{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* INPUT */
input{
  padding:10px;
  margin:12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.4);
  color:white;
}

/* IFRAME */
iframe{
  flex:1;
  border:none;
}

/* ICON SVG STYLE */
svg{
  width:22px;
  height:22px;
  stroke:white;
  fill:none;
  stroke-width:1.6;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<!-- TOP BAR -->
<div class="topbar">
  <div>Orbital</div>
  <div id="time"></div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <!-- DOCK -->
  <div class="dock">

    <!-- Browser -->
    <div class="icon" onclick="openApp('proxy')">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18"></path>
      </svg>
    </div>

    <!-- Settings -->
    <div class="icon" onclick="openApp('settings')">
      <svg viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"></path>
        <path d="M19.4 15a1.7 1.7 0 000-3l-1.1-.6.2-1.2a1.7 1.7 0 00-2.6-1.8l-1 .7-1-.7a1.7 1.7 0 00-2.6 1.8l.2 1.2-1.1.6a1.7 1.7 0 000 3l1.1.6-.2 1.2a1.7 1.7 0 002.6 1.8l1-.7 1 .7a1.7 1.7 0 002.6-1.8l-.2-1.2 1.1-.6z"></path>
      </svg>
    </div>

  </div>
</div>

<!-- 🌐 PROXY APP -->
<div id="proxy" class="window">
  <div class="wbar">
    <div>Browser</div>
    <div class="close" onclick="closeApp('proxy')">✕</div>
  </div>

  <div class="content">
    <input id="url" placeholder="Search or enter URL">
    <iframe id="frame"></iframe>
  </div>
</div>

<!-- ⚙️ SETTINGS APP -->
<div id="settings" class="window">
  <div class="wbar">
    <div>Settings</div>
    <div class="close" onclick="closeApp('settings')">✕</div>
  </div>

  <div class="content">
    <input id="titleInput" placeholder="Tab title">
    <input id="panicInput" placeholder="Panic URL (\ key)">
  </div>
</div>

<script>

/* OPEN/CLOSE APPS */
function openApp(id){
  document.getElementById(id).style.display="flex";
  document.getElementById("desktop").style.display="none";
}

function closeApp(id){
  document.getElementById(id).style.display="none";
  document.getElementById("desktop").style.display="block";
}

/* PROXY NAV */
document.getElementById("url").onchange = e=>{
  let v=e.target.value;
  frame.src=v.startsWith("http")?v:"https://www.google.com/search?q="+v;
};

/* CLOCK */
setInterval(()=>{
  let d=new Date();
  let h=d.getHours()%12||12;
  let m=d.getMinutes().toString().padStart(2,"0");
  time.innerText=`${h}:${m}`;
},1000);

/* PANIC KEY */
document.addEventListener("keydown",e=>{
  if(e.key==="\\"){
    let url=localStorage.panic||"https://google.com";
    window.location.href=url;
  }
});

/* SAVE SETTINGS */
titleInput.oninput=()=>{
  document.title=titleInput.value;
};

panicInput.oninput=()=>{
  localStorage.panic=panicInput.value;
};

/* 🌌 STAR BACKGROUND */
const c=document.getElementById("stars");
const ctx=c.getContext("2d");
let w,h,stars=[];

function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}
resize();
onresize=resize;

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h});
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="white";

  stars.forEach(s=>{
    s.y+=0.3;
    if(s.y>h) s.y=0;
    ctx.fillRect(s.x,s.y,2,2);
  });

  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
