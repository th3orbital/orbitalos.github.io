<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbital OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Space Grotesk", sans-serif;
}

body{
  background:#05060a;
  overflow:hidden;
  color:white;
}

/* STAR BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  height:32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.12);
  font-size:12px;
}

/* DESKTOP */
#desktop{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* CLOCK */
#clock{
  font-size:80px;
  color:#a855f7;
}

/* DOCK */
.dock{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  padding:10px 14px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,0.12);
}

/* ICONS */
.icon{
  width:44px;
  height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  border-radius:10px;
  transition:0.15s;
}

.icon:hover{
  background:rgba(255,255,255,0.08);
}

/* OVERLAYS (SAFE SYSTEM) */
.overlay{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:rgba(10,10,20,0.95);
  backdrop-filter: blur(18px);
}

/* TOP BAR INSIDE WINDOW */
.bar{
  height:36px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}

/* CLOSE */
.close{
  color:#ff5c5c;
  cursor:pointer;
}

/* INPUT */
input{
  margin:10px;
  padding:10px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.4);
  color:white;
  outline:none;
}

/* IFRAME */
iframe{
  flex:1;
  border:none;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<!-- TOP BAR -->
<div class="topbar">
  <div>Orbital</div>
  <div id="time"></div>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <div id="clock"></div>

  <div class="dock">
    <div class="icon" onclick="openOverlay('proxy')">🌐</div>
    <div class="icon" onclick="openOverlay('settings')">⚙</div>
  </div>
</div>

<!-- PROXY -->
<div id="proxy" class="overlay">
  <div class="bar">
    <div>Browser</div>
    <div class="close" onclick="closeOverlay('proxy')">X</div>
  </div>

  <input id="url" placeholder="Search or enter URL">
  <iframe id="frame"></iframe>
</div>

<!-- SETTINGS -->
<div id="settings" class="overlay">
  <div class="bar">
    <div>Settings</div>
    <div class="close" onclick="closeOverlay('settings')">X</div>
  </div>

  <input id="title" placeholder="Tab title">
  <input id="panic" placeholder="Panic URL (press \)">
</div>

<script>

/* SAFE OPEN/CLOSE SYSTEM (NO BUG STATE ISSUES) */
function openOverlay(id){
  document.getElementById(id).style.display="flex";
}

function closeOverlay(id){
  document.getElementById(id).style.display="none";
}

/* PROXY NAVIGATION */
document.getElementById("url").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    let v=e.target.value.trim();
    document.getElementById("frame").src =
      v.startsWith("http")
        ? v
        : "https://www.google.com/search?q="+encodeURIComponent(v);
  }
});

/* CLOCK */
function updateTime(){
  let d=new Date();
  let h=d.getHours()%12||12;
  let m=d.getMinutes().toString().padStart(2,"0");
  document.getElementById("clock").innerText=`${h}:${m}`;
  document.getElementById("time").innerText=`${h}:${m}`;
}
setInterval(updateTime,1000);
updateTime();

/* PANIC KEY (SAFE GLOBAL LISTENER) */
document.addEventListener("keydown",e=>{
  if(e.key==="\\"){
    let url = localStorage.panic || "https://google.com";
    window.location.href = url;
  }
});

/* SETTINGS SAVE */
document.getElementById("title").addEventListener("input",e=>{
  document.title = e.target.value;
});

document.getElementById("panic").addEventListener("input",e=>{
  localStorage.panic = e.target.value;
});

/* 🌌 SIMPLE STARFIELD (NO LAG / NO BUGS) */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let w,h,stars=[];

function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
}
resize();
window.onresize=resize;

for(let i=0;i<100;i++){
  stars.push({
    x:Math.random()*w,
    y:Math.random()*h,
    s:Math.random()*1.5
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="white";

  for(let s of stars){
    s.y += s.s;
    if(s.y>h) s.y=0;
    ctx.fillRect(s.x,s.y,2,2);
  }

  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
