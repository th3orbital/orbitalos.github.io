<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#7cf7ff;
    --accent:#8b5cff;
    --soft:rgba(124,247,255,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* 🌌 CANVAS */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* ⚠️ DISCLAIMER */
#disclaimer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    text-align:center;
    color:var(--main);
}

.discBox h2{
    font-weight:100;
    letter-spacing:2px;
    margin-bottom:10px;
}

.discBox p{
    font-size:12px;
    opacity:0.85;
    line-height:1.5;
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:opacity 0.7s ease;
    display:none;
}

#boot h1{
    font-weight:100;
    letter-spacing:22px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    color:var(--main);
    font-size:12px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%) contrast(1.2);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    color:var(--main);
}

/* 🧠 WIDGETS */
#widgets{
    position:absolute;
    left:20px;
    top:80px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:260px;
}

.widget{
    padding:12px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--soft);
    backdrop-filter: blur(12px);
    animation:float 6s ease-in-out infinite;
}

.widget:nth-child(2){animation-delay:1s;}
.widget:nth-child(3){animation-delay:2s;}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

.wTitle{
    font-size:10px;
    opacity:0.7;
    margin-bottom:6px;
    letter-spacing:2px;
    color:var(--main);
}

.wText{
    font-size:12px;
    opacity:0.85;
    color:white;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

/* ICONS (UNCHANGED) */
.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
    filter: drop-shadow(0 0 8px rgba(124,247,255,0.4));
    transition:0.2s;
}

.dock-app:hover svg{
    transform:scale(1.1);
    filter: drop-shadow(0 0 14px rgba(139,92,255,0.8));
}

/* WINDOWS */
.window{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(5,5,15,0.85);
    backdrop-filter: blur(18px);
    transform:scale(0.85);
    opacity:0;
    transition:0.25s ease;
}

.window.open{
    transform:scale(1);
    opacity:1;
}

.windowTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:12px;
    border-bottom:1px solid var(--soft);
    color:var(--main);
}

.closeBtn{
    color:var(--accent);
    cursor:pointer;
}

/* PROXY */
.windowBar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--soft);
}

.windowBar input{
    flex:1;
    padding:8px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
}

.windowBar button{
    padding:8px 12px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* SETTINGS */
.settingsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:12px;
}

.card{
    padding:12px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.4);
    color:var(--main);
}

/* CONTAINERS */
#proxyApp,#settingsApp{
    position:fixed;
    inset:0;
    display:none;
    z-index:2000;
}

/* CANVAS */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}
</style>
</head>

<body>

<!-- 🌌 BACKGROUND -->
<canvas id="space"></canvas>

<!-- ⚠️ DISCLAIMER -->
<div id="disclaimer">
    <div class="discBox">
        <h2>NOTICE</h2>
        <p>
            This system is for educational / experimental use only.<br><br>
            The creator is not responsible for any use or consequences.<br><br>
            Use at your own risk — and have fun.
        </p>
        <button onclick="accept()">I Understand</button>
    </div>
</div>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <!-- WIDGETS -->
    <div id="widgets">
        <div class="widget">
            <div class="wTitle">SYSTEM</div>
            <div class="wText" id="sysStatus"></div>
        </div>

        <div class="widget">
            <div class="wTitle">SIGNAL</div>
            <div class="wText" id="signal"></div>
        </div>

        <div class="widget">
            <div class="wTitle">QUOTE</div>
            <div class="wText" id="quote"></div>
        </div>
    </div>

    <!-- DOCK -->
    <div id="dock">

        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c3 4 3 14 0 18"></path>
            </svg>
        </div>

        <div class="dock-app" onclick="openSettings()">
            <svg viewBox="0 0 24 24">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path>
                <path d="M19 12h2"></path>
                <path d="M3 12h2"></path>
            </svg>
        </div>

    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">
    <div class="window" id="proxyWindow">
        <div class="windowTop">
            <div>Proxy</div>
            <div class="closeBtn" onclick="closeProxy()">✕</div>
        </div>
        <div class="windowBar">
            <input id="proxyUrl">
            <button onclick="goProxy()">Go</button>
        </div>
        <iframe id="proxyFrame"></iframe>
    </div>
</div>

<!-- SETTINGS -->
<div id="settingsApp">
    <div class="window" id="settingsWindow">
        <div class="windowTop">
            <div>Settings</div>
            <div class="closeBtn" onclick="closeSettings()">✕</div>
        </div>
        <div class="settingsGrid">
            <div class="card">
                <h3>Tab Name</h3>
                <input id="tabName">
                <button onclick="apply()">Apply</button>
            </div>
        </div>
    </div>
</div>

<script>

/* DISCLAIMER */
function accept(){
    document.getElementById("disclaimer").style.display="none";
    document.getElementById("boot").style.display="flex";
}

/* ENTER */
document.getElementById("enter").onclick=()=>{
    boot.style.opacity="0";
    setTimeout(()=>{
        boot.style.display="none";
        desktop.style.opacity="1";
        video.style.display="block";
        video.play();
    },700);
};

/* SPACE ENGINE */
const c=document.getElementById("space");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let stars=[],shoot=[],mx=0,my=0,cx=0,cy=0;

for(let i=0;i<160;i++){
    stars.push({x:Math.random()*c.width,y:Math.random()*c.height,z:Math.random()*2});
}

document.addEventListener("mousemove",e=>{
    mx=(e.clientX/c.width-0.5)*2;
    my=(e.clientY/c.height-0.5)*2;
});

setInterval(()=>{
    shoot.push({x:Math.random()*c.width,y:Math.random()*c.height/2,vx:6,vy:2,life:60});
},2500);

function draw(){
    x.clearRect(0,0,c.width,c.height);

    cx+=(mx-cx)*0.06;
    cy+=(my-cy)*0.06;

    for(let s of stars){
        let px=s.x+cx*40*s.z;
        let py=s.y+cy*40*s.z;
        x.fillStyle="#7cf7ff";
        x.globalAlpha=0.6;
        x.fillRect(px,py,1.2,1.2);
    }

    requestAnimationFrame(draw);
}
draw();

/* CLOCK */
setInterval(()=>{
    let d=new Date();
    time.innerText=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,"0")}`;
},1000);

/* SIMPLE WIDGETS */
quote.innerText="Orbit beyond limits.";
sysStatus.innerText="SYSTEM ONLINE";
signal.innerText="CLEAR";

/* APPS */
function openProxy(){proxyApp.style.display="block";proxyWindow.classList.add("open");}
function closeProxy(){proxyWindow.classList.remove("open");setTimeout(()=>proxyApp.style.display="none",200);}
function goProxy(){proxyFrame.src=proxyUrl.value;}

function openSettings(){settingsApp.style.display="block";settingsWindow.classList.add("open");}
function closeSettings(){settingsWindow.classList.remove("open");setTimeout(()=>settingsApp.style.display="none",200);}
function apply(){document.title=tabName.value;}

/* KEY */
let state=0;
document.addEventListener("keydown",e=>{
    if(e.key==="\\"){
        state=(state+1)%3;
        if(state===1) openProxy();
        if(state===2) openSettings();
    }
});

</script>

</body>
</html>
