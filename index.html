<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

/* 🔥 NEW GALAXY BACKGROUND */
body{
    height:100vh;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at 50% 40%, rgba(255,40,40,0.15), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(255,0,0,0.08), transparent 50%),
    radial-gradient(circle at center, rgba(0,0,0,0.4), #000 80%),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop")
    center/cover no-repeat fixed;
}

/* subtle stars */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(white 1px, transparent 1px);
    background-size:3px 3px;
    opacity:0.06;
    pointer-events:none;
}

/* slow nebula movement */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle, rgba(255,60,60,0.08), transparent 60%);
    animation:drift 25s linear infinite;
    pointer-events:none;
}

@keyframes drift{
    from{transform:translateY(0);}
    to{transform:translateY(-40px);}
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    font-size:12px;
    letter-spacing:3px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.7);
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.7);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:26px;
    height:26px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* PROXY */
#proxyApp{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
    z-index:2000;
}

#proxyTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#proxyBar{
    display:flex;
    gap:8px;
    padding:10px;
}

#proxyBar input{
    flex:1;
    padding:8px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
}

#proxyBar button{
    padding:8px 12px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
    cursor:pointer;
}

#proxyFrame{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">CLICK TO ENTER</div>
</div>

<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<div id="desktop">
    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">
        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>
    </div>
</div>

<div id="proxyApp">
    <div id="proxyTop">
        <div>ORBITAL'S PROXY</div>
        <div onclick="closeProxy()" style="cursor:pointer;color:red;">EXIT</div>
    </div>

    <div id="proxyBar">
        <input id="proxyUrl" placeholder="Search Google or enter URL">
        <button onclick="goProxy()">GO</button>
    </div>

    <iframe id="proxyFrame"></iframe>
</div>

<script>
document.getElementById("enter").onclick=()=>{
    document.getElementById("boot").style.display="none";
    let v=document.getElementById("video");
    v.style.display="block";
    v.play();
};

let press=0;
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);
        if(press===2){
            let v=document.getElementById("video");
            v.pause();
            v.src="";
            v.style.display="none";
            document.getElementById("desktop").style.opacity="1";
        }
    }
});

document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

function openProxy(){
    document.getElementById("proxyApp").style.display="block";
    document.getElementById("proxyFrame").src="https://www.google.com";
}

function closeProxy(){
    document.getElementById("proxyApp").style.display="none";
}

function goProxy(){
    let q=document.getElementById("proxyUrl").value;
    let frame=document.getElementById("proxyFrame");

    if(!q){
        frame.src="https://www.google.com";
        return;
    }

    if(!q.includes(".") && !q.startsWith("http")){
        frame.src="https://www.google.com/search?q="+encodeURIComponent(q);
    } else {
        frame.src=q.startsWith("http")?q:"https://"+q;
    }
}

function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();
</script>

</body>
</html>
