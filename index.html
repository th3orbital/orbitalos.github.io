<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:30px;
    font-size:3rem;
    color:var(--red);
    text-shadow:0 0 25px rgba(255,42,42,0.25);
}

#enter{
    margin-top:40px;
    padding:16px 40px;
    border:1px solid var(--red-soft);
    letter-spacing:3px;
    font-size:12px;
    color:rgba(255,255,255,0.6);
    cursor:default;
}

/* ---------- VIDEO ---------- */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

#skip{
    position:fixed;
    top:12px;
    right:12px;
    z-index:600;
    display:none;
    padding:8px 12px;
    font-size:12px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--red-soft);
    color:white;
}

/* ---------- DESKTOP ---------- */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.75);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:30%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    letter-spacing:-6px;
    color:white;
}

/* ---------- DESKTOP AREA ---------- */
#desktopArea{
    position:absolute;
    inset:0;
}

/* ---------- DOCK (clean, minimal) ---------- */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.7);
    border:1px solid var(--red-soft);
}

/* ---------- APP ICONS ---------- */
.app{
    width:70px;
    height:70px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    position:absolute;
    transition:0.2s;
}

.app svg{
    width:28px;
    height:28px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* dock version */
.dock-app{
    position:relative;
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    border:1px solid var(--red-soft);
}

.dock-app svg{
    width:24px;
    height:24px;
}

/* drag */
.dragging{
    opacity:0.6;
    transform:scale(1.1);
}

</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skip()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <!-- desktop drop zone -->
    <div id="desktopArea"></div>

    <!-- DOCK -->
    <div id="dock">

        <div class="dock-app" data-app="arcade">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="6" width="16" height="12" rx="2"/>
                <path d="M8 10h.01M16 10h.01M9 14h6"/>
            </svg>
        </div>

        <div class="dock-app" data-app="net">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

        <div class="dock-app" data-app="system">
            <svg viewBox="0 0 24 24">
                <path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>
            </svg>
        </div>

    </div>

</div>

<script>

let z = 10;

/* DOUBLE CLICK ENTER */
let clicks = 0;
document.getElementById("enter").onclick = () => {
    clicks++;
    setTimeout(()=>clicks=0,400);
    if(clicks===2) start();
};

function start(){
    document.getElementById("boot").style.display="none";

    const v=document.getElementById("video");
    const skip=document.getElementById("skip");

    v.style.display="block";
    skip.style.display="block";

    v.play();
}

/* SKIP */
function skip(){
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* END VIDEO */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* ---------- DRAG SYSTEM ---------- */
function makeDraggable(el){
    let offsetX, offsetY, dragging=false;

    el.addEventListener("mousedown",(e)=>{
        dragging=true;
        el.classList.add("dragging");

        offsetX=e.offsetX;
        offsetY=e.offsetY;

        el.style.zIndex=++z;
    });

    document.addEventListener("mousemove",(e)=>{
        if(!dragging) return;

        el.style.left=(e.clientX-offsetX)+"px";
        el.style.top=(e.clientY-offsetY)+"px";
    });

    document.addEventListener("mouseup",()=>{
        dragging=false;
        el.classList.remove("dragging");
    });
}

/* CREATE APP FROM DOCK */
document.querySelectorAll(".dock-app").forEach(d=>{
    d.addEventListener("dblclick",()=>{
        const type=d.dataset.app;

        const app=document.createElement("div");
        app.className="app";

        app.style.left="200px";
        app.style.top="200px";

        if(type==="arcade"){
            app.innerHTML=`<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h.01M16 10h.01M9 14h6"/></svg>`;
        }

        if(type==="net"){
            app.innerHTML=`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18"/></svg>`;
        }

        if(type==="system"){
            app.innerHTML=`<svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/></svg>`;
        }

        document.getElementById("desktopArea").appendChild(app);
        makeDraggable(app);
    });
});

/* CLOCK */
function tick(){
    const now=new Date();
    let h=now.getHours();
    const m=now.getMinutes().toString().padStart(2,"0");
    h=h%12||12;

    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
