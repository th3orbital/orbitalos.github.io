<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root {
    --glass: rgba(255,255,255,0.65);
    --glass-soft: rgba(255,255,255,0.35);
    --border: rgba(0,0,0,0.08);
    --text: #111;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body {
    height:100vh;
    overflow:hidden;
    background: linear-gradient(135deg, #d8d8d8, #bfbfbf);
}

/* ---------- BOOT ---------- */
#boot {
    position:fixed;
    inset:0;
    background:#f5f5f7;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1 {
    font-weight:200;
    letter-spacing:20px;
    font-size:3rem;
    color:#111;
}

#boot button {
    margin-top:40px;
    padding:12px 45px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.1);
    background:white;
    cursor:pointer;
}

/* ---------- VIDEO ---------- */
#video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* ---------- MENU BAR ---------- */
.menu {
    position:absolute;
    top:0;
    width:100%;
    height:28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(25px);
    border-bottom:1px solid var(--border);
    font-size:12px;
}

/* ---------- CENTER CLOCK ---------- */
.center {
    position:absolute;
    top:35%;
    width:100%;
    text-align:center;
}

#time {
    font-size:9rem;
    font-weight:200;
    color:#111;
    letter-spacing:-5px;
}

#date {
    margin-top:8px;
    font-size:0.9rem;
    color:rgba(0,0,0,0.5);
    letter-spacing:3px;
}

/* ---------- DOCK ---------- */
.dock {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:20px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(30px);
    border:1px solid rgba(0,0,0,0.08);
}

.icon {
    width:54px;
    height:54px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    transition:.2s;
}

.icon:hover {
    transform:scale(1.4) translateY(-6px);
}

/* ---------- ANIMATION ---------- */
#desktop.show {
    opacity:1;
}
</style>
</head>

<body>

<!-- BOOT SCREEN -->
<div id="boot">
    <h1>ORBITAL</h1>
    <button onclick="start()">Start</button>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="menu">
        <div> Orbital OS</div>
        <div id="topTime"></div>
    </div>

    <div class="center">
        <div id="time">0:00</div>
        <div id="date">MONDAY</div>
    </div>

    <div class="dock">
        <div class="icon">🏠</div>
        <div class="icon">🌐</div>
        <div class="icon">⚙️</div>
        <div class="icon">📂</div>
    </div>

</div>

<script>

function start() {
    document.getElementById("boot").style.display = "none";

    const video = document.getElementById("video");
    video.style.display = "block";
    video.play();
}

document.getElementById("video").onended = () => {
    document.getElementById("video").style.display = "none";
    document.getElementById("desktop").classList.add("show");
};

/* CLOCK */
function tick() {
    const now = new Date();

    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,"0");

    const time = `${h % 12 || 12}:${m}`;

    document.getElementById("time").innerText = time;
    document.getElementById("topTime").innerText = time;

    document.getElementById("date").innerText =
        now.toLocaleDateString("en-US", {
            weekday:"long"
        }).toUpperCase();
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
