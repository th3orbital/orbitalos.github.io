<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: black; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. Splash Screen */
        #splash {
            position: fixed; z-index: 100;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: black; transition: opacity 0.8s;
        }
        #splash h1 { color: white; letter-spacing: 5px; margin-bottom: 20px; font-weight: 200; }
        #splash button { 
            padding: 12px 30px; background: white; border: none; 
            border-radius: 20px; cursor: pointer; font-weight: 600;
        }

        /* 2. Intro Video */
        #intro-vid {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; display: none; z-index: 50;
        }

        /* 3. Apple Style Home Screen */
        #home-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #83a4d4, #b6fbff); /* Classic Apple-style gradient */
            display: flex; flex-direction: column;
            align-items: center; opacity: 0; z-index: 10;
            transition: opacity 1.5s ease-in;
        }

        #home-screen h2 { margin-top: 100px; color: white; font-size: 2.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }

        /* The "Dock" at the bottom */
        .dock {
            position: absolute; bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .icon {
            width: 50px; height: 50px;
            background: white; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .icon:hover { transform: translateY(-10px); }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="startSequence()">Enter</button>
    </div>

    <video id="intro-vid">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div id="home-screen">
        <h2>Welcome to Orbital</h2>
        
        <div class="dock">
            <div class="icon">🎮</div>
            <div class="icon">🌐</div>
            <div class="icon">⚙️</div>
        </div>
    </div>

    <script>
        const splash = document.getElementById('splash');
        const video = document.getElementById('intro-vid');
        const home = document.getElementById('home-screen');

        function startSequence() {
            // Hide splash, show and play video
            splash.style.opacity = "0";
            setTimeout(() => { splash.style.display = "none"; }, 800);

            video.style.display = "block";
            video.muted = false;
            video.play();
        }

        // Detect when the video finishes
        video.onended = function() {
            // Fade out video
            video.style.transition = "opacity 1s";
            video.style.opacity = "0";
            
            // Show Home Screen
            home.style.opacity = "1";
            
            setTimeout(() => { video.style.display = "none"; }, 1000);
        };
    </script>
</body>
</html>
