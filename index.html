<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#7cf7ff;
    --accent:#8b5cff;
    --soft:rgba(124,247,255,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* 🌌 BACKGROUND */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* ⚠️ DISCLAIMER */
#disclaimer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    text-align:center;
    color:var(--main);
}

.discBox h2{
    font-weight:100;
    letter-spacing:2px;
    margin-bottom:10px;
}

.discBox p{
    font-size:12px;
    opacity:0.85;
    line-height:1.5;
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    display:none;
    transition:opacity 0.7s ease;
}

#boot h1{
    font-weight:100;
    letter-spacing:22px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    color:var(--main);
    font-size:12px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%) contrast(1.2);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    color:var(--main);
}

/* WIDGETS */
#widgets{
    position:absolute;
    left:20px;
    top:80px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:260px;
}

.widget{
    padding:12px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--soft);
    backdrop-filter: blur(12px);
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
}

.wTitle{
    font-size:10px;
    opacity:0.7;
    margin-bottom:6px;
    letter-spacing:2px;
    color:var(--main);
}

.wText{
    font-size:12px;
    opacity:0.85;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

/* ICONS (UNCHANGED) */
.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
    filter: drop-shadow(0 0 8px rgba(124,247,255,0.4));
}

/* WINDOWS */
.window{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(5,5,15,0.85);
    backdrop-filter: blur(18px);
    transform:scale(0.85);
    opacity:0;
    transition:0.25s ease;
}

.window.open{
    transform:scale(1);
    opacity:1;
}

.windowTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:12px;
    border-bottom:1px solid var(--soft);
    color:var(--main);
}

.closeBtn{
    color:var(--accent);
    cursor:pointer;
}

/* PROXY */
.windowBar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid var(--soft);
}

.windowBar input{
    flex:1;
    padding:8px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
}

.windowBar button{
    padding:8px 12px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* SETTINGS */
.settingsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:12px;
}

.card{
    padding:12px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.4);
    color:var(--main);
}

/* CANVAS */
#space{
    position:fixed;
    inset:0;
    z-index:-1;
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<!-- ⚠️ DISCLAIMER -->
<div id="disclaimer">
    <div class="discBox">
        <h2>NOTICE</h2>
        <p>
            This system is provided as-is with no guarantees or warranties.<br><br>
            The creator is not responsible for any actions taken or any consequences that result from its use.<br><br>
            Use at your own risk — and have fun.
        </p>
        <button onclick="accept()">I Understand</button>
    </div>
</div>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="widgets">
        <div class="widget">
            <div class="wTitle">SYSTEM</div>
            <div class="wText" id="sysStatus"></div>
        </div>

        <div class="widget">
            <div class="wTitle">SIGNAL</div>
            <div class="wText" id="signal"></div>
        </div>

        <div class="widget">
            <div class="wTitle">QUOTE</div>
            <div class="wText" id="quote"></div>
        </div>
    </div>

    <div id="dock">

        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c3 4 3 14 0 18"></path>
            </svg>
        </div>

        <div class="dock-app" onclick="openSettings()">
            <svg viewBox="0 0 24 24">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path>
            </svg>
        </div>

    </div>
</div>

<script>

/* DISCLAIMER */
function accept(){
    document.getElementById("disclaimer").style.display="none";
    document.getElementById("boot").style.display="flex";
}

/* ENTER */
document.getElementById("enter").onclick=()=>{
    boot.style.opacity="0";
    setTimeout(()=>{
        boot.style.display="none";
        desktop.style.opacity="1";
        video.style.display="block";
        video.play();
    },700);
};

/* CLOCK */
setInterval(()=>{
    let d=new Date();
    time.innerText=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,"0")}`;
},1000);

/* SIMPLE DATA */
quote.innerText="Orbit beyond limits.";
sysStatus.innerText="ONLINE";
signal.innerText="CLEAR";

/* APPS */
function openProxy(){proxyApp.style.display="block";}
function openSettings(){settingsApp.style.display="block";}
</script>

</body>
</html>
