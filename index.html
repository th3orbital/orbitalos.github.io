<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS | Noir</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            color: white;
        }

        /* --- 1. MINIMALIST SPLASH --- */
        #splash {
            position: fixed; z-index: 1000; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #splash h1 { font-weight: 100; font-size: 3rem; letter-spacing: 25px; color: white; margin-bottom: 50px; opacity: 0.6; }
        #splash button { 
            padding: 15px 50px; background: none; border: 1px solid var(--border);
            color: white; border-radius: 2px; cursor: pointer; font-weight: 200;
            letter-spacing: 5px; transition: 0.5s; text-transform: uppercase;
        }
        #splash button:hover { background: white; color: black; letter-spacing: 8px; }

        /* --- 2. THE VIDEO (Greyscale) --- */
        #intro-vid { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; display: none; z-index: 500; 
            filter: grayscale(100%) contrast(1.2); 
        }

        /* --- 3. THE DESKTOP --- */
        #desktop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        /* Menu Bar */
        .top-nav {
            width: 100%; height: 35px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(40px); border-bottom: 0.5px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; font-size: 13px; font-weight: 400; letter-spacing: 1px;
        }

        /* Hero Clock */
        #hero-clock { margin-top: 12vh; text-align: center; }
        #time { font-size: 9rem; font-weight: 100; letter-spacing: -6px; line-height: 1; }
        #date { font-size: 1rem; font-weight: 300; color: rgba(255,255,255,0.4); letter-spacing: 8px; margin-top: 10px; }

        /* Icon Grid */
        .grid { margin-top: 80px; display: flex; gap: 80px; }
        .app { display: flex; flex-direction: column; align-items: center; gap: 20px; text-decoration: none; }
        
        .icon-box {
            width: 120px; height: 120px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 35px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; filter: grayscale(100%) brightness(0.8);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .app:hover .icon-box { 
            transform: scale(1.1) translateY(-15px); 
            background: var(--glass-hover); 
            border-color: rgba(255,255,255,0.3);
            filter: grayscale(0%) brightness(1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }
        
        .app span { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-transform: uppercase; }

        /* THE DOCK */
        .dock-container {
            position: absolute; bottom: 35px;
            padding: 12px 20px; border-radius: 35px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(50px);
            border: 1px solid var(--border);
            display: flex; gap: 18px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .dock-item {
            width: 62px; height: 62px; border-radius: 18px;
            background: rgba(255,255,255,0.02); display: flex; align-items: center;
            justify-content: center; font-size: 2rem; filter: grayscale(100%);
            transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .dock-item:hover { transform: scale(1.5) translateY(-25px); filter: grayscale(0%); background: rgba(255,255,255,0.1); margin: 0 15px; }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="boot()">BOOT</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="desktop">
        <div class="top-nav">
            <div style="font-weight: 600;"> ORBITAL</div>
            <div id="nav-time">0:00 AM</div>
        </div>

        <div id="hero-clock">
            <div id="time">0:00</div>
            <div id="date">JANUARY 01</div>
        </div>

        <div class="grid">
            <div class="app"><div class="icon-box">🎮</div><span>Arcade</span></div>
            <div class="app"><div class="icon-box">🌐</div><span>Proxy</span></div>
            <div class="app"><div class="icon-box">⚙️</div><span>Settings</span></div>
        </div>

        <div class="dock-container">
            <div class="dock-item">🏠</div>
            <div class="dock-item">🧭</div>
            <div class="dock-item">📂</div>
        </div>
    </div>

    <script>
        function boot() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; 
                v.style.display = "block";
                v.muted = false;
                v.play();
            }, 1200);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const d = document.getElementById('desktop');
            v.style.transition = "opacity 1.5s";
            v.style.opacity = "0";
            d.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function tick() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeStr = hours + ":" + minutes;
            document.getElementById('time').innerText = timeStr;
            document.getElementById('nav-time').innerText = timeStr + " " + ampm;
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();
        }
        setInterval(tick, 1000); tick();
    </script>
</body>
</html>
