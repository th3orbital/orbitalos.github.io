<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    font-size:12px;
    letter-spacing:3px;
    cursor:pointer;
}

/* ---------- VIDEO ---------- */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%) contrast(1.2);
    z-index:500;
}

/* ---------- DESKTOP ---------- */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.8);
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
}

/* ---------- DOCK ---------- */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.75);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    cursor:pointer;
    transition:0.25s;
}

.dock-app svg{
    width:26px;
    height:26px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

.dock-app:hover{
    transform:translateY(-6px) scale(1.1);
    background:rgba(255,42,42,0.08);
}

.dock-app:hover svg{
    stroke:#ff4d4d;
    filter:drop-shadow(0 0 6px rgba(255,42,42,0.6));
}

/* ---------- PROXY ---------- */
#proxyApp{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
    z-index:2000;
}

#proxyTop{
    height:42px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#proxyBar{
    display:flex;
    gap:10px;
    padding:12px;
}

#proxyBar input{
    flex:1;
    padding:10px;
    background:#050505;
    border:1px solid var(--soft);
    color:white;
}

#proxyBar button{
    padding:10px 14px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
    cursor:pointer;
}

#proxyFrame{
    width:100%;
    height:calc(100% - 85px);
    border:none;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">CLICK TO ENTER</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">
    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">

        <!-- PROXY -->
        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

        <!-- ARCADE -->
        <div class="dock-app" onclick="openArcade()">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="7" width="18" height="10" rx="2"/>
                <circle cx="9" cy="12" r="1.2"/>
                <circle cx="15" cy="12" r="1.2"/>
            </svg>
        </div>

    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">
    <div id="proxyTop">
        <div style="color:#ff2a2a;">ORBITAL’S PROXY</div>
        <div onclick="closeProxy()" style="cursor:pointer;">EXIT</div>
    </div>

    <div id="proxyBar">
        <input id="proxyUrl" placeholder="Search Google or enter URL">
        <button onclick="goProxy()">GO</button>
    </div>

    <iframe id="proxyFrame"></iframe>
</div>

<script>

/* START */
document.getElementById("enter").onclick=()=>{
    document.getElementById("boot").style.display="none";
    const v=document.getElementById("video");
    v.style.display="block";
    v.play();
};

/* DOUBLE ENTER SKIP */
let press=0;
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);

        if(press===2){
            const v=document.getElementById("video");
            v.pause();
            v.src="";
            v.style.display="none";
            document.getElementById("desktop").style.opacity="1";
        }
    }
});

/* END VIDEO */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* PROXY */
function openProxy(){
    document.getElementById("proxyApp").style.display="block";
    document.getElementById("desktop").style.opacity="0";
    document.getElementById("proxyFrame").src="https://www.google.com";
}

function closeProxy(){
    document.getElementById("proxyApp").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

function goProxy(){
    let q=document.getElementById("proxyUrl").value;
    let frame=document.getElementById("proxyFrame");

    if(!q){
        frame.src="https://www.google.com";
        return;
    }

    if(!q.includes(".") && !q.startsWith("http")){
        frame.src="https://www.google.com/search?q="+encodeURIComponent(q);
    } else {
        frame.src=q.startsWith("http")?q:"https://"+q;
    }
}

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

/* ARCADE */
function openArcade(){
    alert("Arcade coming soon");
}

</script>

</body>
</html>
