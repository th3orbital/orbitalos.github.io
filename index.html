<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#a855f7;
    --accent:#6d28d9;
    --soft:rgba(168,85,247,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* DISCLAIMER */
#disclaimer{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.88);
    z-index:9999;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.75);
    backdrop-filter: blur(14px);
    text-align:center;
    color:var(--main);
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000;
}

#boot h1{
    letter-spacing:22px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
}

/* SKIP TEXT */
#skipHint{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:var(--main);
    opacity:0.7;
    display:none;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    color:var(--main);
}

/* WIDGETS */
#widgets{
    position:absolute;
    left:20px;
    top:80px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:260px;
}

.widget{
    padding:12px;
    background:rgba(0,0,0,0.35);
    border:1px solid var(--soft);
    backdrop-filter: blur(12px);
}

.wTitle{
    font-size:10px;
    opacity:0.7;
    margin-bottom:6px;
    letter-spacing:2px;
}

.wText{
    font-size:12px;
    opacity:0.85;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
}
</style>
</head>

<body>

<!-- DISCLAIMER -->
<div id="disclaimer">
    <div class="discBox">
        <p>
            This site could be blocked at any time.<br><br>
            Use at your own risk.
        </p>
        <button onclick="accept()">ENTER</button>
    </div>
</div>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video" muted playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div id="skipHint">Press ENTER twice to skip</div>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="widgets">
        <div class="widget">
            <div class="wTitle">SYSTEM</div>
            <div class="wText" id="sysStatus"></div>
        </div>

        <div class="widget">
            <div class="wTitle">SIGNAL</div>
            <div class="wText" id="signal"></div>
        </div>

        <div class="widget">
            <div class="wTitle">QUOTE</div>
            <div class="wText" id="quote"></div>
        </div>
    </div>

    <div id="dock">
        <div class="dock-app">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c3 4 3 14 0 18"></path>
            </svg>
        </div>
    </div>

</div>

<script>

/* DISCLAIMER */
function accept(){
    disclaimer.style.display="none";
    boot.style.display="flex";
}

/* START */
enter.onclick=()=>{
    boot.style.display="none";

    video.style.display="block";
    skipHint.style.display="block";
    video.play();
};

/* DOUBLE ENTER SKIP */
let press=0;

document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);

        if(press===2){
            endVideo();
        }
    }
});

/* VIDEO END FIX */
video.onended = endVideo;

function endVideo(){
    video.pause();
    video.style.display="none";
    skipHint.style.display="none";
    desktop.style.opacity="1";
}

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    time.innerText=`${h}:${m}`;
    nav.innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

/* TEXT */
quote.innerText="Orbit beyond limits.";
sysStatus.innerText="ONLINE";
signal.innerText="CLEAR";

</script>

</body>
</html>
