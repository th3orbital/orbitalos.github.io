<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root {
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body {
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT SCREEN ---------- */
#boot {
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1 {
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
    text-shadow:0 0 25px rgba(255,42,42,0.25);
}

/* DOUBLE CLICK ENTER AREA */
#enterArea {
    margin-top:40px;
    font-size:12px;
    letter-spacing:4px;
    color:rgba(255,255,255,0.5);
    padding:20px 40px;
    border:1px solid var(--red-soft);
    cursor:default;
    transition:.3s;
}

#enterArea:hover {
    border-color:var(--red);
    color:white;
}

/* ---------- VIDEO ---------- */
#video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

/* SKIP */
#skip {
    position:fixed;
    top:15px;
    right:15px;
    z-index:600;
    padding:8px 14px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--red-soft);
    color:white;
    font-size:12px;
    letter-spacing:2px;
    display:none;
    cursor:pointer;
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar {
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    background:rgba(0,0,0,0.75);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

/* CLOCK */
.center {
    position:absolute;
    top:32%;
    width:100%;
    text-align:center;
}

#time {
    font-size:10rem;
    font-weight:100;
    letter-spacing:-6px;
    text-shadow:0 0 25px rgba(255,42,42,0.15);
}

#date {
    margin-top:10px;
    font-size:0.9rem;
    letter-spacing:6px;
    opacity:0.5;
}

/* APPS */
.grid {
    position:absolute;
    top:55%;
    width:100%;
    display:flex;
    justify-content:center;
    gap:80px;
}

.app {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.icon {
    width:120px;
    height:120px;
    border-radius:28px;
    border:1px solid var(--red-soft);
    background:rgba(255,255,255,0.03);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.3s;
}

.icon svg {
    width:40px;
    height:40px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.5;
}

.app span {
    font-size:11px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.6);
}

/* DOCK */
.dock {
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:12px 16px;
    border-radius:28px;
    background:rgba(0,0,0,0.7);
    border:1px solid var(--red-soft);
}

.dock-item {
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>

    <!-- DOUBLE CLICK AREA -->
    <div id="enterArea">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skipVideo()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div class="center">
        <div id="time">0:00</div>
        <div id="date">SYSTEM READY</div>
    </div>

    <div class="grid">

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="6" width="16" height="12" rx="2"/>
                    <path d="M8 10h.01M16 10h.01M9 14h6"/>
                </svg>
            </div>
            <span>ORBITAL ARCADE</span>
        </div>

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18M12 3c3 4 3 14 0 18"/>
                </svg>
            </div>
            <span>ORBITAL NET</span>
        </div>

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>
                </svg>
            </div>
            <span>ORBITAL SYSTEM</span>
        </div>

    </div>

</div>

<script>

let clickCount = 0;
let clickTimer = null;

/* DOUBLE CLICK LOGIC */
document.getElementById("enterArea").addEventListener("click", () => {
    clickCount++;

    if (clickCount === 1) {
        clickTimer = setTimeout(() => {
            clickCount = 0;
        }, 400);
    }

    if (clickCount === 2) {
        clearTimeout(clickTimer);
        startOS();
        clickCount = 0;
    }
});

function startOS() {
    document.getElementById("boot").style.display = "none";

    const v = document.getElementById("video");
    const skip = document.getElementById("skip");

    v.style.display = "block";
    skip.style.display = "block";

    v.play();
}

/* SKIP VIDEO */
function skipVideo() {
    const v = document.getElementById("video");

    v.pause();
    v.style.display = "none";

    document.getElementById("skip").style.display = "none";
    document.getElementById("desktop").style.opacity = "1";
}

document.getElementById("video").onended = () => {
    document.getElementById("video").style.display = "none";
    document.getElementById("skip").style.display = "none";
    document.getElementById("desktop").style.opacity = "1";
};

/* CLOCK */
function tick() {
    const now = new Date();

    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,"0");

    h = h % 12 || 12;

    document.getElementById("time").innerText = `${h}:${m}`;
    document.getElementById("nav").innerText = `${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
