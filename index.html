<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS Pro</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.15);
            --bg-gradient: linear-gradient(135deg, #000428 0%, #004e92 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: white;
        }

        /* --- 1. MINIMAL SPLASH --- */
        #splash {
            position: fixed; z-index: 1000;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #000; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #splash h1 { font-weight: 100; font-size: 3rem; letter-spacing: 15px; margin-bottom: 30px; opacity: 0; animation: fadeIn 2s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        #splash button { 
            padding: 12px 35px; background: white; border: none;
            color: black; border-radius: 25px; cursor: pointer; font-weight: 600;
            transition: 0.4s; transform: translateY(20px);
        }
        #splash button:hover { transform: translateY(20px) scale(1.05); box-shadow: 0 0 30px rgba(255,255,255,0.4); }

        /* --- 2. VIDEO STAGE --- */
        #intro-vid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; z-index: 500; }

        /* --- 3. THE "PRO" HOME SCREEN --- */
        #home-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        /* Animated background "Blobs" for depth */
        .blob {
            position: absolute; width: 600px; height: 600px;
            background: rgba(0, 210, 255, 0.2);
            filter: blur(80px); border-radius: 50%; z-index: -1;
            animation: move 20s infinite alternate;
        }
        @keyframes move { from { transform: translate(-20%, -20%); } to { transform: translate(20%, 20%); } }

        /* Top Menu Bar */
        .menu-bar {
            width: 100%; height: 32px; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px); display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; font-size: 13px; font-weight: 600;
            border-bottom: 0.5px solid var(--border);
        }

        /* Center Content */
        #clock-section { margin-top: 10vh; text-align: center; }
        #time { font-size: 6rem; font-weight: 200; letter-spacing: -2px; }
        #date { font-size: 1.2rem; font-weight: 400; opacity: 0.8; text-transform: uppercase; letter-spacing: 2px; }

        /* App Icons */
        .app-container {
            margin-top: 50px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 50px;
        }
        .app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .app-img {
            width: 80px; height: 80px; background: var(--glass);
            backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; transition: 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .app:hover .app-img { transform: scale(1.1); background: rgba(255,255,255,0.2); }
        .app span { font-size: 12px; font-weight: 500; }

        /* The Dock */
        .dock {
            position: absolute; bottom: 25px; padding: 10px 15px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--border); border-radius: 24px;
            display: flex; gap: 15px; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .dock-item {
            width: 55px; height: 55px; border-radius: 14px;
            background: rgba(255,255,255,0.05); display: flex; align-items: center;
            justify-content: center; font-size: 1.8rem; transition: 0.3s cubic-bezier(0.2, 1, 0.2, 1);
        }
        .dock-item:hover { transform: scale(1.4) translateY(-15px); background: rgba(255,255,255,0.2); margin: 0 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="start()">ENTER SYSTEM</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="home-screen">
        <div class="blob"></div>
        <div class="menu-bar">
            <div> Orbital</div>
            <div id="menu-time">00:00</div>
        </div>

        <div id="clock-section">
            <div id="time">00:00</div>
            <div id="date">MONDAY, MAY 1</div>
        </div>

        <div class="app-container">
            <div class="app"><div class="app-img">🕹️</div><span>Games</span></div>
            <div class="app"><div class="app-img">🧊</div><span>Proxy</span></div>
            <div class="app"><div class="app-img">🛰️</div><span>Social</span></div>
            <div class="app"><div class="app-img">📁</div><span>Files</span></div>
        </div>

        <div class="dock">
            <div class="dock-item">🏠</div>
            <div class="dock-item">🧭</div>
            <div class="dock-item">💬</div>
            <div class="dock-item">⚙️</div>
        </div>
    </div>

    <script>
        function start() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; 
                v.style.display = "block";
                v.muted = false;
                v.play();
            }, 1000);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const h = document.getElementById('home-screen');
            v.style.transition = "opacity 1.5s";
            v.style.opacity = "0";
            h.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function updateTime() {
            const now = new Date();
            const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').innerText = t;
            document.getElementById('menu-time').innerText = t;
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
