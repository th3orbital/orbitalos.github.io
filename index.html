<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: black; }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            z-index: -1;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        // This is a "Safety Kickstart" for the video
        var video = document.getElementById("bg-video");
        
        // Try to play the video immediately
        video.play().catch(function(error) {
            console.log("Autoplay was prevented. Waiting for a click.");
            
            // If the browser blocks it, play it as soon as the user clicks anywhere
            document.body.addEventListener('click', function() {
                video.play();
            }, { once: true });
        });
    </script>

</body>
</html>
