<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS | Pro</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }

        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: var(--font-main);
            color: white;
        }

        /* --- 1. BOOT SPLASH --- */
        #splash {
            position: fixed; z-index: 1000; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #splash h1 { 
            font-weight: 100; font-size: 3.5rem; letter-spacing: 18px; 
            margin-bottom: 40px; color: white; text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        #splash button { 
            padding: 14px 45px; background: none; border: 1px solid var(--border);
            color: white; border-radius: 50px; cursor: pointer; font-weight: 300;
            letter-spacing: 2px; transition: 0.4s; backdrop-filter: blur(10px);
        }

        #splash button:hover { background: white; color: black; box-shadow: 0 0 40px rgba(255,255,255,0.3); transform: scale(1.05); }

        /* --- 2. INTRO VIDEO --- */
        #intro-vid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; z-index: 500; }

        /* --- 3. PREMIUM DESKTOP --- */
        #desktop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* High-end Mesh Gradient Wallpaper */
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        /* Ambient Glow Blobs */
        .ambient-light {
            position: absolute; width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.08) 0%, transparent 70%);
            top: -10%; right: -10%; pointer-events: none; z-index: -1;
        }

        /* Top Menu Bar */
        .menu-bar {
            width: 100%; height: 32px; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(25px); display: flex; justify-content: space-between;
            align-items: center; padding: 0 25px; font-size: 13px; font-weight: 600;
            border-bottom: 0.5px solid var(--border);
        }

        /* Central Clock */
        #hero-clock { margin-top: 8vh; text-align: center; pointer-events: none; }
        #time { font-size: 7.5rem; font-weight: 200; letter-spacing: -4px; }
        #date { font-size: 1.4rem; font-weight: 300; opacity: 0.7; letter-spacing: 3px; margin-top: -10px; }

        /* Icon Grid */
        .app-grid { margin-top: 50px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 45px; }
        .app-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .app-btn {
            width: 85px; height: 85px; background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border); border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.3rem; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); cursor: pointer;
        }
        .app-btn:hover { transform: scale(1.1) translateY(-10px); background: rgba(255,255,255,0.2); }
        .app-item span { font-size: 13px; opacity: 0.8; }

        /* --- 4. THE DOCK (Based on your Image) --- */
        .dock-wrapper {
            position: absolute; bottom: 20px;
            display: flex; justify-content: center; width: 100%;
        }

        .dock {
            display: flex; align-items: flex-end; gap: 12px; padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 26px; box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .dock-item {
            width: 55px; height: 55px; border-radius: 14px;
            background: rgba(255,255,255,0.08); display: flex; align-items: center;
            justify-content: center; font-size: 1.9rem; transition: 0.25s cubic-bezier(0.2, 1, 0.2, 1);
            position: relative;
        }

        .dock-item:hover {
            transform: scale(1.4) translateY(-18px);
            background: rgba(255,255,255,0.2);
            margin: 0 12px;
        }

        /* Active App Dot */
        .dock-item::after {
            content: ''; position: absolute; bottom: -8px;
            width: 4px; height: 4px; background: white;
            border-radius: 50%; opacity: 0; transition: 0.3s;
        }
        .dock-item:hover::after { opacity: 0.8; }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="boot()">INITIALIZE</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="desktop">
        <div class="ambient-light"></div>
        <div class="menu-bar">
            <div> Orbital OS</div>
            <div id="nav-time">00:00</div>
        </div>

        <div id="hero-clock">
            <div id="time">00:00</div>
            <div id="date">JANUARY 01</div>
        </div>

        <div class="app-grid">
            <div class="app-item"><div class="app-btn">🎮</div><span>Arcade</span></div>
            <div class="app-item"><div class="app-btn">🌐</div><span>Proxy</span></div>
            <div class="app-item"><div class="app-btn">🛰️</div><span>Social</span></div>
            <div class="app-item"><div class="app-btn">⚙️</div><span>Settings</span></div>
        </div>

        <div class="dock-wrapper">
            <div class="dock">
                <div class="dock-item">🏠</div>
                <div class="dock-item">🧭</div>
                <div class="dock-item">💬</div>
                <div class="dock-item">🎧</div>
                <div class="dock-item">📂</div>
            </div>
        </div>
    </div>

    <script>
        function boot() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; 
                v.style.display = "block";
                v.muted = false; // Sound enabled on click
                v.play();
            }, 1000);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const d = document.getElementById('desktop');
            v.style.transition = "opacity 1.5s";
            v.style.opacity = "0";
            d.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function tick() {
            const now = new Date();
            const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').innerText = t;
            document.getElementById('nav-time').innerText = t;
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();
        }
        setInterval(tick, 1000); tick();
    </script>
</body>
</html>
