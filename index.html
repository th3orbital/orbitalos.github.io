<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at 50% 40%, rgba(255,40,40,0.12), transparent 45%),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop")
    center/cover no-repeat fixed;

    transition: background-position 0.2s ease-out;
}

/* STARS */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(white 1px, transparent 1px);
    background-size:4px 4px;
    opacity:0.05;
    animation: drift 60s linear infinite;
    pointer-events:none;
}

@keyframes drift{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:opacity 0.8s ease;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid rgba(255,42,42,0.25);
    font-size:12px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.7);
    border-bottom:1px solid rgba(255,42,42,0.25);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(255,42,42,0.25);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

/* WINDOW SYSTEM */
.window{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:rgba(0,0,0,0.85);
    backdrop-filter: blur(18px);

    transform: scale(0.85);
    opacity:0;
    transition:0.25s ease;
}

.window.open{
    transform: scale(1);
    opacity:1;
}

.windowTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:12px;
    border-bottom:1px solid rgba(255,42,42,0.25);
}

.closeBtn{
    color:var(--red);
    cursor:pointer;
}

/* PROXY */
.windowBar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid rgba(255,42,42,0.15);
}

.windowBar input{
    flex:1;
    padding:8px;
    background:transparent;
    border:1px solid rgba(255,42,42,0.25);
    color:white;
}

.windowBar button{
    padding:8px 12px;
    background:transparent;
    border:1px solid rgba(255,42,42,0.25);
    color:white;
    cursor:pointer;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* SETTINGS */
.settingsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:12px;
}

.card{
    padding:12px;
    border:1px solid rgba(255,42,42,0.2);
    background:rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    gap:8px;
}

.card input{
    padding:8px;
    background:transparent;
    border:1px solid rgba(255,42,42,0.25);
    color:white;
}

.card button{
    padding:6px;
    background:transparent;
    border:1px solid rgba(255,42,42,0.25);
    color:white;
    cursor:pointer;
}

/* CONTAINERS */
#proxyApp, #settingsApp{
    position:fixed;
    inset:0;
    display:none;
    z-index:2000;
}

</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">CLICK TO ENTER</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">
        <div class="dock-app" onclick="openProxy()">
            🌐
        </div>

        <div class="dock-app" onclick="openSettings()">
            ⚙️
        </div>
    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">
    <div class="window" id="proxyWindow">

        <div class="windowTop">
            <div>Orbital Proxy</div>
            <div class="closeBtn" onclick="closeProxy()">✕</div>
        </div>

        <div class="windowBar">
            <input id="proxyUrl" placeholder="Search or URL">
            <button onclick="goProxy()">Go</button>
        </div>

        <iframe id="proxyFrame"></iframe>

    </div>
</div>

<!-- SETTINGS -->
<div id="settingsApp">
    <div class="window" id="settingsWindow">

        <div class="windowTop">
            <div>Settings</div>
            <div class="closeBtn" onclick="closeSettings()">✕</div>
        </div>

        <div class="settingsGrid">

            <div class="card">
                <h3>Tab Disguise</h3>
                <input id="tabName" placeholder="Fake tab name">
                <button onclick="applyDisguise()">Apply</button>
            </div>

            <div class="card">
                <h3>Redirect Key (\)</h3>
                <input id="redirectUrl" placeholder="https://example.com">
            </div>

        </div>

    </div>
</div>

<script>

/* ENTER */
document.getElementById("enter").onclick=()=>{
    let boot=document.getElementById("boot");
    boot.style.opacity="0";

    setTimeout(()=>{
        boot.style.display="none";
        let v=document.getElementById("video");
        v.style.display="block";
        v.play();
    },800);
};

document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* BACKGROUND MOUSE MOVE */
document.addEventListener("mousemove",(e)=>{
    let mx=(e.clientX/window.innerWidth-0.5)*2;
    let my=(e.clientY/window.innerHeight-0.5)*2;
    document.body.style.backgroundPosition=`${50+mx*5}% ${50+my*5}%`;
});

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

/* PROXY OPEN ANIMATION */
function openProxy(){
    proxyApp.style.display="block";
    setTimeout(()=>proxyWindow.classList.add("open"),10);
    proxyFrame.src="https://google.com";
}

function closeProxy(){
    proxyWindow.classList.remove("open");
    setTimeout(()=>proxyApp.style.display="none",200);
}

function goProxy(){
    let q=proxyUrl.value;
    if(!q) return;
    if(!q.includes(".")) q="https://google.com/search?q="+encodeURIComponent(q);
    proxyFrame.src=q.startsWith("http")?q:"https://"+q;
}

/* SETTINGS OPEN ANIMATION */
function openSettings(){
    settingsApp.style.display="block";
    setTimeout(()=>settingsWindow.classList.add("open"),10);
}

function closeSettings(){
    settingsWindow.classList.remove("open");
    setTimeout(()=>settingsApp.style.display="none",200);
}

/* DISGUISE */
function applyDisguise(){
    let name=document.getElementById("tabName").value;
    if(name) document.title=name;
}

/* KEYBINDS */
let tabState=0;

document.addEventListener("keydown",(e)=>{

    /* ENTER SKIP */
    if(e.key==="Enter"){
        document.getElementById("video").style.display="none";
        document.getElementById("desktop").style.opacity="1";
    }

    /* SWITCH APPS */
    if(e.key==="\\"){
        tabState=(tabState+1)%3;

        if(tabState===0){
            closeProxy();
            closeSettings();
        }
        if(tabState===1){
            openProxy();
            closeSettings();
        }
        if(tabState===2){
            openSettings();
            closeProxy();
        }
    }

});

</script>

</body>
</html>
