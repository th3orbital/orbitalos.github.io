<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-heavy: rgba(0, 0, 0, 0.6);
            --accent: #00d2ff;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            color: var(--text);
        }

        /* --- 1. PRO SPLASH SCREEN --- */
        #splash {
            position: fixed; z-index: 1000;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: black;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #splash h1 { 
            font-weight: 100; font-size: 4rem; letter-spacing: 20px; 
            margin-bottom: 50px; color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        #splash button { 
            padding: 16px 50px; background: none; border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 40px; cursor: pointer; font-weight: 300;
            letter-spacing: 3px; transition: 0.5s; backdrop-filter: blur(10px);
        }

        #splash button:hover { 
            background: white; color: black; box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }

        /* --- 2. INTRO VIDEO --- */
        #intro-vid {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; display: none; z-index: 500;
        }

        /* --- 3. PREMIUM HOME SCREEN --- */
        #home-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            /* High-end Wallpaper */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover no-repeat, 
                        linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; flex-direction: column;
            align-items: center; opacity: 0; z-index: 100;
            transition: opacity 2.5s ease;
        }

        /* Top Bar / Status Bar */
        #status-bar {
            width: 100%; padding: 15px 40px;
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(10px);
            font-size: 0.9rem; font-weight: 500; letter-spacing: 1px;
        }

        /* Main Center Content */
        #clock-container {
            margin-top: 8vh; text-align: center;
        }

        #time { font-size: 7rem; font-weight: 200; letter-spacing: -2px; }
        #date { font-size: 1.5rem; font-weight: 300; opacity: 0.7; margin-top: -10px; }

        /* The App Grid */
        .app-grid {
            margin-top: 60px; display: grid;
            grid-template-columns: repeat(4, 1fr); gap: 40px;
        }

        .app-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; transition: 0.3s; cursor: pointer;
        }

        .app-icon {
            width: 85px; height: 85px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .app-item:hover .app-icon {
            transform: scale(1.1) translateY(-10px);
            background: rgba(255,255,255,0.2);
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
        }

        .app-label { font-size: 0.85rem; font-weight: 400; opacity: 0.9; }

        /* Modern Dock */
        .dock-container {
            position: absolute; bottom: 30px;
            padding: 12px 20px; border-radius: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; gap: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .dock-icon {
            width: 65px; height: 65px;
            border-radius: 18px; cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; background: rgba(255,255,255,0.05);
        }

        .dock-icon:hover { 
            transform: scale(1.4) translateY(-20px);
            background: rgba(255,255,255,0.2);
            margin: 0 10px;
        }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="startSequence()">BOOT SYSTEM</button>
    </div>

    <video id="intro-vid">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div id="home-screen">
        <div id="status-bar">
            <span>Orbital OS v1.0</span>
            <span id="status-right">Online • 100%</span>
        </div>

        <div id="clock-container">
            <div id="time">00:00</div>
            <div id="date">MONDAY, JANUARY 1</div>
        </div>

        <div class="app-grid">
            <div class="app-item"><div class="app-icon">🎮</div><span class="app-label">Games</span></div>
            <div class="app-item"><div class="app-icon">🌐</div><span class="app-label">Proxy</span></div>
            <div class="app-item"><div class="app-icon">💾</div><span class="app-label">Library</span></div>
            <div class="app-item"><div class="app-icon">🛠️</div><span class="app-label">Dev Tools</span></div>
        </div>
        
        <div class="dock-container">
            <div class="dock-icon">🏠</div>
            <div class="dock-icon">📁</div>
            <div class="dock-icon">🎧</div>
            <div class="dock-icon">⚙️</div>
        </div>
    </div>

    <script>
        // System Sequence Logic
        function startSequence() {
            const splash = document.getElementById('splash');
            const video = document.getElementById('intro-vid');
            splash.style.opacity = "0";
            setTimeout(() => { 
                splash.style.display = "none"; 
                video.style.display = "block";
                video.muted = false;
                video.play();
            }, 1200);
        }

        document.getElementById('intro-vid').onended = function() {
            const video = document.getElementById('intro-vid');
            const home = document.getElementById('home-screen');
            video.style.transition = "opacity 1.5s";
            video.style.opacity = "0";
            home.style.opacity = "1";
            setTimeout(() => { video.style.display = "none"; }, 1500);
        };

        // Real-time Clock Logic
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
