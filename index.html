<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root {
    --glass: rgba(255,255,255,0.65);
    --glass-soft: rgba(255,255,255,0.35);
    --border: rgba(0,0,0,0.08);
    --text: #111;
    --blur: 25px;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}

body, html {
    width:100%;
    height:100%;
    overflow:hidden;
    background: linear-gradient(135deg, #e6e6e6, #cfcfcf);
}

/* ---------- SPLASH ---------- */
#splash {
    position:fixed;
    inset:0;
    background:#f5f5f7;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
    transition:1s ease;
}

#splash h1 {
    font-weight:300;
    letter-spacing:18px;
    font-size:2.8rem;
    color:#111;
}

#splash button {
    margin-top:40px;
    padding:12px 40px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.1);
    background:white;
    cursor:pointer;
    font-weight:500;
    transition:.25s;
}

#splash button:hover {
    transform:scale(1.05);
}

/* ---------- VIDEO ---------- */
#intro-vid {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    opacity:0;
    transition:1.2s ease;
}

/* ---------- MENU BAR (macOS style) ---------- */
.topbar {
    position:absolute;
    top:0;
    width:100%;
    height:28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    background:rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    border-bottom:1px solid var(--border);
    font-size:12px;
    color:var(--text);
}

/* ---------- CENTER CLOCK ---------- */
.center {
    position:absolute;
    top:18%;
    width:100%;
    text-align:center;
}

#time {
    font-size:8rem;
    font-weight:200;
    color:#111;
    letter-spacing:-4px;
}

#date {
    margin-top:6px;
    font-size:0.9rem;
    color:rgba(0,0,0,0.55);
    letter-spacing:3px;
}

/* ---------- APP GRID ---------- */
.grid {
    position:absolute;
    top:45%;
    width:100%;
    display:flex;
    justify-content:center;
    gap:70px;
}

.app {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.icon {
    width:110px;
    height:110px;
    border-radius:24px;
    background:rgba(255,255,255,0.7);
    backdrop-filter: blur(25px);
    border:1px solid rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.8rem;
    box-shadow:0 20px 40px rgba(0,0,0,0.08);
    transition:.25s;
}

.app:hover .icon {
    transform:scale(1.08) translateY(-6px);
    box-shadow:0 30px 60px rgba(0,0,0,0.12);
}

.app span {
    font-size:12px;
    color:rgba(0,0,0,0.55);
}

/* ---------- DOCK (macOS style) ---------- */
.dock {
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(30px);
    border:1px solid rgba(0,0,0,0.08);
}

.dock-item {
    width:54px;
    height:54px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    transition:.2s;
}

.dock-item:hover {
    transform:scale(1.35) translateY(-8px);
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <h1>ORBITAL</h1>
    <button onclick="boot()">Start</button>
</div>

<!-- VIDEO -->
<video id="intro-vid">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div> Orbital OS</div>
        <div id="nav-time"></div>
    </div>

    <div class="center">
        <div id="time">0:00</div>
        <div id="date">MONDAY, JANUARY 1</div>
    </div>

    <div class="grid">
        <div class="app">
            <div class="icon">🎮</div>
            <span>Arcade</span>
        </div>

        <div class="app">
            <div class="icon">🌐</div>
            <span>Browser</span>
        </div>

        <div class="app">
            <div class="icon">⚙️</div>
            <span>Settings</span>
        </div>
    </div>

    <div class="dock">
        <div class="dock-item">🏠</div>
        <div class="dock-item">📂</div>
        <div class="dock-item">🧭</div>
        <div class="dock-item">🗑️</div>
    </div>

</div>

<script>
function boot() {
    const splash = document.getElementById("splash");
    const video = document.getElementById("intro-vid");

    splash.style.opacity = "0";

    setTimeout(() => {
        splash.style.display = "none";
        video.style.display = "block";
        video.play();
    }, 800);
}

document.getElementById("intro-vid").onended = () => {
    const v = document.getElementById("intro-vid");
    const d = document.getElementById("desktop");

    v.style.opacity = "0";
    d.style.opacity = "1";

    setTimeout(() => v.style.display = "none", 1000);
};

/* clock */
function tick() {
    const now = new Date();

    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? "PM" : "AM";

    h = h % 12 || 12;

    const time = `${h}:${m}`;

    document.getElementById("time").innerText = time;
    document.getElementById("nav-time").innerText = `${time} ${ampm}`;

    document.getElementById("date").innerText =
        now.toLocaleDateString("en-US", {
            weekday:"long",
            month:"long",
            day:"numeric"
        }).toUpperCase();
}

setInterval(tick,1000);
tick();
</script>

</body>
</html>
