<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at center, rgba(0,0,0,0.3), #000 75%),
    url("galaxy.jpg") center/cover no-repeat fixed;
}

/* GLASS */
.glass{
    background:rgba(10,10,10,0.55);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,42,42,0.2);
    box-shadow:0 0 60px rgba(255,0,0,0.15);
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000;
    z-index:1000;
}

#boot h1{
    letter-spacing:28px;
    font-weight:100;
    color:var(--red);
}

#enter{
    margin-top:40px;
    border:1px solid rgba(255,42,42,0.3);
    padding:12px 40px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%);
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:88%;
    height:40px;
    border-radius:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 16px;
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-60%);
    font-size:8rem;
    font-weight:100;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:22px;
    padding:18px 30px;
    border-radius:26px;

    background:rgba(10,10,10,0.55);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,42,42,0.2);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:28px;
    height:28px;
    stroke:#ff2a2a;
    fill:none;
    stroke-width:1.6;
}

.dock-app:hover svg{
    stroke:#ff5a5a;
    filter:drop-shadow(0 0 10px red);
}

/* PROXY PANEL (RIGHT SIDE DOCKED) */
#proxyApp{
    position:fixed;
    top:70px;
    right:20px;
    bottom:20px;
    width:420px;

    display:none;
    flex-direction:column;

    border-radius:18px;
    overflow:hidden;

    background:rgba(10,10,10,0.6);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,42,42,0.2);
}

#proxyTop{
    height:38px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:11px;
    border-bottom:1px solid rgba(255,42,42,0.15);
}

#proxyBar{
    display:flex;
    gap:8px;
    padding:10px;
}

#proxyBar input{
    flex:1;
    padding:8px;
    background:#0a0a0a;
    border:1px solid rgba(255,42,42,0.2);
    color:white;
}

#proxyBar button{
    padding:8px 12px;
    background:#000;
    border:1px solid rgba(255,42,42,0.3);
    color:white;
}

#proxyFrame{
    flex:1;
    border:none;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">CLICK TO ENTER</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar glass">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">

        <!-- PROXY -->
        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">

    <div id="proxyTop">
        <div style="color:#ff2a2a;">ORBITAL'S PROXY</div>
        <div onclick="closeProxy()" style="cursor:pointer;">EXIT</div>
    </div>

    <div id="proxyBar">
        <input id="proxyUrl" placeholder="Search Google or enter URL">
        <button onclick="goProxy()">GO</button>
    </div>

    <iframe id="proxyFrame"></iframe>

</div>

<script>

/* START */
document.getElementById("enter").onclick=()=>{
    document.getElementById("boot").style.display="none";
    let v=document.getElementById("video");
    v.style.display="block";
    v.play();
};

/* DOUBLE ENTER SKIP */
let press=0;
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);

        if(press===2){
            let v=document.getElementById("video");
            v.pause();
            v.src="";
            v.style.display="none";
            document.getElementById("desktop").style.opacity="1";
        }
    }
});

/* VIDEO END */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* PROXY */
function openProxy(){
    document.getElementById("proxyApp").style.display="flex";
    document.getElementById("proxyFrame").src="https://www.google.com";
}

function closeProxy(){
    document.getElementById("proxyApp").style.display="none";
}

function goProxy(){
    let q=document.getElementById("proxyUrl").value;
    let frame=document.getElementById("proxyFrame");

    if(!q){
        frame.src="https://www.google.com";
        return;
    }

    if(!q.includes(".") && !q.startsWith("http")){
        frame.src="https://www.google.com/search?q="+encodeURIComponent(q);
    } else {
        frame.src=q.startsWith("http")?q:"https://"+q;
    }
}

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

</script>

</body>
</html>
