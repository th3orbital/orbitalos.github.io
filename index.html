<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root {
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body {
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot {
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1 {
    font-weight:100;
    letter-spacing:30px;
    font-size:3rem;
    color:var(--red);
    text-shadow:0 0 25px rgba(255,42,42,0.25);
}

#enterArea {
    margin-top:40px;
    padding:18px 40px;
    border:1px solid var(--red-soft);
    letter-spacing:4px;
    font-size:12px;
    color:rgba(255,255,255,0.6);
}

/* ---------- VIDEO ---------- */
#video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

/* SKIP */
#skip {
    position:fixed;
    top:15px;
    right:15px;
    z-index:600;
    padding:8px 14px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--red-soft);
    font-size:12px;
    display:none;
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar {
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 14px;
    background:rgba(0,0,0,0.75);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

/* CLOCK */
.center {
    position:absolute;
    top:32%;
    width:100%;
    text-align:center;
}

#time {
    font-size:10rem;
    font-weight:100;
    letter-spacing:-6px;
    text-shadow:0 0 25px rgba(255,42,42,0.15);
}

/* ---------- HOTBAR ---------- */
.hotbar {
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:16px;
    padding:14px 18px;
    border-radius:26px;
    background:rgba(0,0,0,0.75);
    border:1px solid var(--red-soft);
    backdrop-filter:blur(40px);
}

/* ICON WRAPPER */
.app {
    width:70px;
    height:70px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;

    animation:popIn .6s ease forwards;
    opacity:0;
}

/* stagger animation */
.app:nth-child(1){animation-delay:.1s;}
.app:nth-child(2){animation-delay:.2s;}
.app:nth-child(3){animation-delay:.3s;}

/* ICON */
.icon {
    width:54px;
    height:54px;
    border-radius:14px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--red-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s;
}

/* SVG */
.icon svg {
    width:26px;
    height:26px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* HOVER ANIMATION */
.app:hover {
    transform:translateY(-10px) scale(1.1);
}

.app:hover .icon {
    border-color:var(--red);
    box-shadow:0 0 25px rgba(255,42,42,0.3);
}

/* CLICK ANIMATION */
.app:active {
    transform:scale(0.95);
}

/* LABEL */
.label {
    position:absolute;
    bottom:-18px;
    font-size:10px;
    letter-spacing:2px;
    color:rgba(255,255,255,0.5);
}

/* POP IN ANIMATION */
@keyframes popIn {
    from {
        transform:translateY(20px) scale(0.8);
        opacity:0;
    }
    to {
        transform:translateY(0) scale(1);
        opacity:1;
    }
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enterArea">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skipVideo()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div class="center">
        <div id="time">0:00</div>
    </div>

    <!-- HOTBAR -->
    <div class="hotbar">

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="6" width="16" height="12" rx="2"/>
                    <path d="M8 10h.01M16 10h.01M9 14h6"/>
                </svg>
            </div>
            <div class="label">ARCADE</div>
        </div>

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18M12 3c3 4 3 14 0 18"/>
                </svg>
            </div>
            <div class="label">NET</div>
        </div>

        <div class="app">
            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>
                </svg>
            </div>
            <div class="label">SYSTEM</div>
        </div>

    </div>

</div>

<script>

/* DOUBLE CLICK ENTER */
let clicks = 0;
document.getElementById("enterArea").onclick = () => {
    clicks++;
    setTimeout(() => clicks = 0, 400);

    if(clicks === 2) start();
};

function start() {
    document.getElementById("boot").style.display = "none";

    const v = document.getElementById("video");
    const skip = document.getElementById("skip");

    v.style.display = "block";
    skip.style.display = "block";

    v.play();
}

/* SKIP */
function skipVideo() {
    const v = document.getElementById("video");

    v.pause();
    v.style.display = "none";
    document.getElementById("skip").style.display = "none";
    document.getElementById("desktop").style.opacity = "1";
}

/* END VIDEO */
document.getElementById("video").onended = () => {
    document.getElementById("video").style.display = "none";
    document.getElementById("skip").style.display = "none";
    document.getElementById("desktop").style.opacity = "1";
};

/* CLOCK */
function tick() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,"0");
    h = h % 12 || 12;

    document.getElementById("time").innerText = `${h}:${m}`;
    document.getElementById("nav").innerText = `${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
