<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#7cf7ff;
    --accent:#8b5cff;
    --soft:rgba(124,247,255,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ⚠️ WARNING */
#disclaimer{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.9);
    z-index:9999;
    animation:fadeIn 0.3s ease forwards;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.8);
    backdrop-filter: blur(14px);
    text-align:center;
    color:var(--main);
    animation:popIn 0.4s ease;
}

.discBox h2{
    font-weight:100;
    letter-spacing:2px;
    margin-bottom:10px;
}

.discBox p{
    font-size:12px;
    opacity:0.85;
    line-height:1.5;
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes popIn{from{transform:scale(0.7);}to{transform:scale(1);}}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:20px;
    font-size:3rem;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    color:var(--main);
    font-size:12px;
    cursor:pointer;
}

/* 🎬 VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    font-size:12px;
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:30%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    color:var(--main);
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:28px;
    height:28px;
    stroke:var(--main);
    fill:none;
    stroke-width:1.4;
}
</style>
</head>

<body>

<!-- ⚠️ WARNING -->
<div id="disclaimer">
    <div class="discBox">
        <h2>SYSTEM WARNING</h2>
        <p>
            This site could be blocked at any time.<br><br>
            Join the DC so you don’t miss out — DC not made yet.<br><br>
            Use at your own risk — and have fun.
        </p>
        <button onclick="accept()">I Understand</button>
    </div>
</div>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">ENTER SYSTEM</div>
</div>

<!-- 🎬 VIDEO -->
<video id="video" muted playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">
        <div class="dock-app">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M3 12h18"></path>
                <path d="M12 3c3 4 3 14 0 18"></path>
            </svg>
        </div>
    </div>

</div>

<script>

/* WARNING ACCEPT */
function accept(){
    disclaimer.style.display="none";
    boot.style.display="flex";
}

/* ENTER */
enter.onclick=()=>{
    boot.style.display="none";

    let v = document.getElementById("video");
    v.style.display="block";
    v.play();

    /* show desktop AFTER video starts */
    setTimeout(()=>{
        desktop.style.opacity="1";
    },500);
};

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    time.innerText=`${h}:${m}`;
    nav.innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

</script>

</body>
</html>
