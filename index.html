<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:30px;
    font-size:3rem;
    color:var(--red);
    text-shadow:0 0 25px rgba(255,42,42,0.25);
}

#enter{
    margin-top:40px;
    padding:16px 40px;
    border:1px solid var(--red-soft);
    letter-spacing:3px;
    font-size:12px;
    color:rgba(255,255,255,0.6);
    cursor:default;
}

/* ---------- VIDEO ---------- */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

#skip{
    position:fixed;
    top:12px;
    right:12px;
    z-index:600;
    display:none;
    padding:8px 12px;
    font-size:12px;
    background:rgba(0,0,0,0.6);
    border:1px solid var(--red-soft);
    color:white;
}

/* ---------- DESKTOP ---------- */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.75);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:30%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    letter-spacing:-6px;
}

/* ---------- DOCK ---------- */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.7);
    border:1px solid var(--red-soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    cursor:pointer;
}

.dock-app svg{
    width:24px;
    height:24px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* ---------- APP GRID (fixed positions) ---------- */
.app{
    position:absolute;
    width:90px;
    height:90px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    opacity:0;
    transform:scale(0.8);
    animation:spawn .25s forwards;
}

@keyframes spawn{
    to{
        opacity:1;
        transform:scale(1);
    }
}

.icon{
    width:70px;
    height:70px;
    border-radius:18px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--red-soft);
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon svg{
    width:28px;
    height:28px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

.label{
    font-size:10px;
    letter-spacing:2px;
    opacity:0.6;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skip()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <!-- APPS WILL APPEAR HERE -->
    <div id="apps"></div>

    <!-- DOCK -->
    <div id="dock">

        <div class="dock-app" onclick="openApp('arcade')">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="6" width="16" height="12" rx="2"/>
                <path d="M8 10h.01M16 10h.01M9 14h6"/>
            </svg>
        </div>

        <div class="dock-app" onclick="openApp('net')">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

        <div class="dock-app" onclick="openApp('system')">
            <svg viewBox="0 0 24 24">
                <path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>
            </svg>
        </div>

    </div>

</div>

<script>

/* BOOT */
let clicks=0;
document.getElementById("enter").onclick=()=>{
    clicks++;
    setTimeout(()=>clicks=0,400);
    if(clicks===2) start();
};

function start(){
    document.getElementById("boot").style.display="none";

    const v=document.getElementById("video");
    const skip=document.getElementById("skip");

    v.style.display="block";
    skip.style.display="block";

    v.play();
}

/* SKIP */
function skip(){
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* END VIDEO */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* APPS SPAWN POSITIONS */
function openApp(type){
    const container=document.getElementById("apps");

    const app=document.createElement("div");
    app.className="app";

    let icon="";

    if(type==="arcade"){
        app.style.left="120px";
        app.style.top="160px";
        icon=`<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h.01M16 10h.01M9 14h6"/>`;
    }

    if(type==="net"){
        app.style.left="260px";
        app.style.top="160px";
        icon=`<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 4 3 14 0 18"/>`;
    }

    if(type==="system"){
        app.style.left="400px";
        app.style.top="160px";
        icon=`<path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>`;
    }

    app.innerHTML=`
        <div class="icon">
            <svg viewBox="0 0 24 24">${icon}</svg>
        </div>
        <div class="label">${type.toUpperCase()}</div>
    `;

    container.appendChild(app);
}

/* CLOCK */
function tick(){
    const now=new Date();
    let h=now.getHours();
    const m=now.getMinutes().toString().padStart(2,"0");
    h=h%12||12;

    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
