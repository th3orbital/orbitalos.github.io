<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbital OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CUSTOM FONT -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05060a;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --accent:#a855f7;
}

/* GLOBAL FONT */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Space Grotesk", sans-serif;
}

body{
  background:var(--bg);
  overflow:hidden;
  color:white;
}

/* STAR BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  width:100%;
  height:34px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:var(--glass);
  backdrop-filter: blur(14px);
  border-bottom:1px solid var(--border);
  font-size:12px;
}

/* DESKTOP */
#desktop{
  position:fixed;
  inset:0;
}

/* CLOCK */
#clock{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  font-size:80px;
  color:var(--accent);
}

/* DOCK */
.dock{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  padding:10px 14px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:18px;
  backdrop-filter: blur(18px);
}

.icon{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* WINDOWS */
.window{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  background:rgba(10,10,20,0.92);
  backdrop-filter: blur(20px);
}

/* TOP BAR */
.wbar{
  height:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid var(--border);
}

/* CLOSE */
.close{
  color:#ff4d4d;
  cursor:pointer;
}

/* INPUT */
input{
  margin:12px;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.4);
  color:white;
}

/* IFRAME */
iframe{
  flex:1;
  border:none;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<!-- TOP BAR -->
<div class="topbar">
  <div>Orbital</div>
  <div id="time"></div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <div id="clock"></div>

  <div class="dock">
    <div class="icon" onclick="openWin('proxy')">🌐</div>
    <div class="icon" onclick="openWin('settings')">⚙️</div>
  </div>

</div>

<!-- PROXY -->
<div id="proxy" class="window">
  <div class="wbar">
    <div>Browser</div>
    <div class="close" onclick="closeWin('proxy')">X</div>
  </div>

  <input id="url" placeholder="Search or URL">
  <iframe id="frame"></iframe>
</div>

<!-- SETTINGS -->
<div id="settings" class="window">
  <div class="wbar">
    <div>Settings</div>
    <div class="close" onclick="closeWin('settings')">X</div>
  </div>

  <input id="title" placeholder="Tab title">
  <input id="panic" placeholder="Panic URL ( \ key )">
</div>

<script>

/* OPEN / CLOSE WINDOWS (SAFE) */
function openWin(id){
  document.getElementById(id).style.display="flex";
}

function closeWin(id){
  document.getElementById(id).style.display="none";
}

/* PROXY */
url.onchange = () => {
  let v=url.value;
  frame.src = v.startsWith("http")
    ? v
    : "https://www.google.com/search?q=" + v;
};

/* CLOCK */
setInterval(()=>{
  let d=new Date();
  let h=d.getHours()%12||12;
  let m=d.getMinutes().toString().padStart(2,"0");
  time.innerText=`${h}:${m}`;
},1000);

/* PANIC KEY */
document.addEventListener("keydown",e=>{
  if(e.key==="\\"){
    let u=localStorage.panic||"https://google.com";
    window.location.href=u;
  }
});

/* SAVE SETTINGS */
title.oninput=()=>document.title=title.value;
panic.oninput=()=>localStorage.panic=panic.value;

/* STAR BACKGROUND */
const c=document.getElementById("stars");
const ctx=c.getContext("2d");
let w,h,stars=[];

function resize(){
  w=c.width=innerWidth;
  h=c.height=innerHeight;
}
resize();onresize=resize;

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h});
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="white";

  stars.forEach(s=>{
    s.y+=0.4;
    if(s.y>h)s.y=0;
    ctx.fillRect(s.x,s.y,2,2);
  });

  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
