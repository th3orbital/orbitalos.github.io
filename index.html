<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at 50% 40%, rgba(255,40,40,0.12), transparent 45%),
    url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920&auto=format&fit=crop")
    center/cover no-repeat fixed;
}

/* stars */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(white 1px, transparent 1px);
    background-size:4px 4px;
    opacity:0.05;
    animation: drift 60s linear infinite;
    pointer-events:none;
}

@keyframes drift{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:opacity 0.8s ease;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    font-size:12px;
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%);
    z-index:500;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.7);
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
}

/* DOCK */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.7);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:26px;
    height:26px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* PROXY */
#proxyApp{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
    z-index:2000;
}

#proxyTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#proxyBar{
    display:flex;
    gap:8px;
    padding:10px;
}

#proxyBar input{
    flex:1;
    padding:8px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
}

#proxyBar button{
    padding:8px 12px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
    cursor:pointer;
}

#proxyFrame{
    width:100%;
    height:100%;
    border:none;
}

/* SETTINGS */
#settingsApp{
    position:fixed;
    inset:0;
    display:none;
    background:rgba(0,0,0,0.85);
    z-index:2100;
}

#settingsTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#settingsBody{
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.setting{
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:12px;
}

input{
    padding:8px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">CLICK TO ENTER</div>
</div>

<!-- VIDEO -->
<video id="video" muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">

        <!-- proxy -->
        <div class="dock-app" onclick="openProxy()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

        <!-- settings -->
        <div class="dock-app" onclick="openSettings()">
            <svg viewBox="0 0 24 24">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
                <path d="M19.4 15a7.8 7.8 0 0 0 .1-1l2-1.5-2-3.5-2.4.5a7.5 7.5 0 0 0-1.7-1L15 6h-6l-.4 2a7.5 7.5 0 0 0-1.7 1L4.5 8.5 2.5 12 4.4 13.5a7.8 7.8 0 0 0 .1 1L2.5 16l2 3.5 2.4-.5a7.5 7.5 0 0 0 1.7 1l.4 2h6l.4-2a7.5 7.5 0 0 0 1.7-1l2.4.5 2-3.5-2-1.5z"/>
            </svg>
        </div>

    </div>
</div>

<!-- PROXY -->
<div id="proxyApp">
    <div id="proxyTop">
        <div>ORBITAL PROXY</div>
        <div onclick="closeProxy()" style="color:red;cursor:pointer;">EXIT</div>
    </div>

    <div id="proxyBar">
        <input id="proxyUrl" placeholder="Search or URL">
        <button onclick="goProxy()">GO</button>
    </div>

    <iframe id="proxyFrame"></iframe>
</div>

<!-- SETTINGS -->
<div id="settingsApp">
    <div id="settingsTop">
        <div>SETTINGS</div>
        <div onclick="closeSettings()" style="color:red;cursor:pointer;">EXIT</div>
    </div>

    <div id="settingsBody">

        <div class="setting">
            <label>Tab Disguise Name</label>
            <input id="tabName">
            <button onclick="applyDisguise()">Apply</button>
        </div>

        <div class="setting">
            <label>Quick Redirect URL (Ctrl+Shift+Q)</label>
            <input id="redirectUrl">
        </div>

    </div>
</div>

<script>

/* BOOT */
document.getElementById("enter").onclick=()=>{
    let boot=document.getElementById("boot");
    boot.style.opacity="0";

    setTimeout(()=>{
        boot.style.display="none";
        let v=document.getElementById("video");
        v.style.display="block";
        v.play();
    },800);
};

/* VIDEO END */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* ENTER SKIP */
let press=0;
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);
        if(press===2){
            let v=document.getElementById("video");
            v.pause();
            v.src="";
            v.style.display="none";
            document.getElementById("desktop").style.opacity="1";
        }
    }

    /* HOTKEY REDIRECT */
    if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==="q"){
        let url=document.getElementById("redirectUrl").value;
        if(!url) return;
        if(!url.startsWith("http")) url="https://"+url;
        window.location.href=url;
    }
});

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

/* PROXY */
function openProxy(){proxyApp.style.display="block";}
function closeProxy(){proxyApp.style.display="none";}
function goProxy(){
    let q=proxyUrl.value;
    if(!q) return proxyFrame.src="https://google.com";
    if(!q.includes(".")) q="https://google.com/search?q="+encodeURIComponent(q);
    proxyFrame.src=q.startsWith("http")?q:"https://"+q;
}

/* SETTINGS */
function openSettings(){settingsApp.style.display="block";}
function closeSettings(){settingsApp.style.display="none";}

function applyDisguise(){
    let name=document.getElementById("tabName").value;
    if(name) document.title=name;
}

</script>

</body>
</html>
