<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS | Noir</title>

<style>
:root {
    --glass: rgba(255,255,255,0.04);
    --glass-strong: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.12);
    --text: rgba(255,255,255,0.92);
    --dim: rgba(255,255,255,0.45);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body, html {
    width:100%;
    height:100%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 20%, #121212 0%, #050505 45%, #000 100%);
    color:white;
}

/* ---------- SPLASH ---------- */
#splash {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
    transition:1s ease;
}

#splash h1 {
    font-weight:100;
    font-size:3rem;
    letter-spacing:28px;
    opacity:.55;
}

#splash button {
    margin-top:45px;
    padding:14px 55px;
    background:transparent;
    border:1px solid var(--border);
    color:white;
    letter-spacing:6px;
    cursor:pointer;
    transition:.3s;
}

#splash button:hover {
    background:white;
    color:black;
    letter-spacing:10px;
}

/* ---------- VIDEO ---------- */
#intro-vid {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2) brightness(0.85);
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transition:1.5s ease;
}

/* ---------- TOP BAR ---------- */
.top-nav {
    width:100%;
    height:38px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 24px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(50px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:12px;
    letter-spacing:1px;
}

/* ---------- CLOCK ---------- */
#hero-clock {
    margin-top:13vh;
    text-align:center;
}

#time {
    font-size:10rem;
    font-weight:100;
    letter-spacing:-8px;
    text-shadow:0 0 30px rgba(255,255,255,0.06);
}

#date {
    margin-top:10px;
    font-size:0.9rem;
    letter-spacing:10px;
    color:var(--dim);
}

/* ---------- APP GRID ---------- */
.grid {
    margin-top:75px;
    display:flex;
    gap:70px;
}

.app {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

.icon-box {
    width:122px;
    height:122px;
    border-radius:30px;
    background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border:1px solid var(--border);
    backdrop-filter:blur(45px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3.2rem;
    box-shadow:0 25px 60px rgba(0,0,0,0.75);
    transition:.35s ease;
}

.app:hover .icon-box {
    transform:translateY(-10px) scale(1.08);
    background:var(--glass-strong);
    border-color:rgba(255,255,255,0.25);
    box-shadow:0 0 25px rgba(255,255,255,0.06),
               0 40px 80px rgba(0,0,0,0.9);
}

.app span {
    font-size:11px;
    letter-spacing:3px;
    color:var(--dim);
}

/* ---------- DOCK ---------- */
.dock-container {
    position:absolute;
    bottom:30px;
    display:flex;
    gap:16px;
    padding:14px 18px;
    border-radius:40px;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(60px);
    border:1px solid var(--border);
    box-shadow:0 35px 90px rgba(0,0,0,0.85);
}

.dock-item {
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.8rem;
    transition:.25s ease;
}

.dock-item:hover {
    transform:scale(1.28) translateY(-10px);
    background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div id="splash">
    <h1>ORBITAL</h1>
    <button onclick="boot()">BOOT</button>
</div>

<video id="intro-vid">
    <source src="video.mp4" type="video/mp4">
</video>

<div id="desktop">

    <div class="top-nav">
        <div style="font-weight:600;"> ORBITAL</div>
        <div id="nav-time">0:00 AM</div>
    </div>

    <div id="hero-clock">
        <div id="time">0:00</div>
        <div id="date">JANUARY 01</div>
    </div>

    <div class="grid">
        <div class="app">
            <div class="icon-box">🎮</div>
            <span>Arcade</span>
        </div>

        <div class="app">
            <div class="icon-box">🌐</div>
            <span>Proxy</span>
        </div>

        <div class="app">
            <div class="icon-box">⚙️</div>
            <span>Settings</span>
        </div>
    </div>

    <div class="dock-container">
        <div class="dock-item">🏠</div>
        <div class="dock-item">🧭</div>
        <div class="dock-item">📂</div>
    </div>

</div>

<script>
function boot() {
    const s = document.getElementById("splash");
    const v = document.getElementById("intro-vid");

    s.style.opacity = "0";

    setTimeout(() => {
        s.style.display = "none";
        v.style.display = "block";
        v.muted = false;
        v.play();
    }, 1000);
}

document.getElementById("intro-vid").onended = function () {
    const v = document.getElementById("intro-vid");
    const d = document.getElementById("desktop");

    v.style.transition = "opacity 1.5s";
    v.style.opacity = "0";
    d.style.opacity = "1";

    setTimeout(() => {
        v.style.display = "none";
    }, 1500);
};

function tick() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;

    const timeStr = hours + ":" + minutes;

    document.getElementById("time").innerText = timeStr;
    document.getElementById("nav-time").innerText = timeStr + " " + ampm;

    document.getElementById("date").innerText =
        now.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric"
        }).toUpperCase();
}

setInterval(tick, 1000);
tick();
</script>

</body>
</html>
