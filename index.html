<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS | Noir Red</title>

<style>
:root {
    --bg1:#050505;
    --bg2:#000;
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
    --glass:rgba(255,255,255,0.04);
    --border:rgba(255,42,42,0.25);
    --text:rgba(255,255,255,0.92);
    --dim:rgba(255,255,255,0.45);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body {
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at 50% 30%, #111 0%, #050505 45%, #000 100%);
    color:white;
}

/* ---------- BOOT ---------- */
#boot {
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

#boot h1 {
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
    text-shadow:0 0 25px var(--red-soft);
}

#boot button {
    margin-top:40px;
    padding:14px 55px;
    background:transparent;
    border:1px solid var(--red-soft);
    color:white;
    letter-spacing:6px;
    cursor:pointer;
    transition:.3s;
}

#boot button:hover {
    background:var(--red);
    color:black;
}

/* ---------- VIDEO ---------- */
#video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

/* ---------- DESKTOP ---------- */
#desktop {
    position:fixed;
    inset:0;
    opacity:0;
    transition:1.2s;
    background: radial-gradient(circle at center, rgba(255,42,42,0.05), transparent 60%);
}

/* ---------- TOP BAR ---------- */
.topbar {
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 16px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(40px);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
    letter-spacing:1px;
}

/* ---------- CENTER CLOCK ---------- */
.center {
    position:absolute;
    top:32%;
    width:100%;
    text-align:center;
}

#time {
    font-size:10rem;
    font-weight:100;
    letter-spacing:-6px;
    color:white;
    text-shadow:0 0 25px rgba(255,42,42,0.15),
                0 0 80px rgba(255,42,42,0.08);
}

#date {
    margin-top:10px;
    font-size:0.9rem;
    letter-spacing:8px;
    color:var(--dim);
}

/* ---------- APP GRID ---------- */
.grid {
    position:absolute;
    top:55%;
    width:100%;
    display:flex;
    justify-content:center;
    gap:70px;
}

.app {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.icon {
    width:120px;
    height:120px;
    border-radius:28px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--red-soft);
    backdrop-filter:blur(30px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    box-shadow:0 0 30px rgba(255,42,42,0.05);
    transition:.3s;
}

.app:hover .icon {
    transform:translateY(-10px) scale(1.08);
    border-color:var(--red);
    box-shadow:0 0 25px rgba(255,42,42,0.25),
               0 40px 80px rgba(0,0,0,0.8);
}

.app span {
    font-size:11px;
    letter-spacing:3px;
    color:var(--dim);
}

/* ---------- DOCK ---------- */
.dock {
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    padding:12px 16px;
    border-radius:28px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(50px);
    border:1px solid var(--red-soft);
}

.dock-item {
    width:58px;
    height:58px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    transition:.25s;
}

.dock-item:hover {
    transform:scale(1.3) translateY(-10px);
    background:rgba(255,42,42,0.15);
}
</style>
</head>

<body>

<div id="boot">
    <h1>ORBITAL</h1>
    <button onclick="start()">ENTER SYSTEM</button>
</div>

<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<div id="desktop">

    <div class="topbar">
        <div>ORBITAL / NOIR SYSTEM</div>
        <div id="nav"></div>
    </div>

    <div class="center">
        <div id="time">0:00</div>
        <div id="date">SYSTEM READY</div>
    </div>

    <div class="grid">
        <div class="app">
            <div class="icon">🎮</div>
            <span>ARCade</span>
        </div>

        <div class="app">
            <div class="icon">🌐</div>
            <span>NET</span>
        </div>

        <div class="app">
            <div class="icon">⚙️</div>
            <span>SYSTEM</span>
        </div>
    </div>

    <div class="dock">
        <div class="dock-item">⌂</div>
        <div class="dock-item">⌘</div>
        <div class="dock-item">⎇</div>
        <div class="dock-item">⛶</div>
    </div>

</div>

<script>

function start() {
    document.getElementById("boot").style.display = "none";

    const v = document.getElementById("video");
    v.style.display = "block";
    v.play();
}

document.getElementById("video").onended = () => {
    document.getElementById("video").style.display = "none";
    document.getElementById("desktop").style.opacity = "1";
};

/* CLOCK */
function tick() {
    const now = new Date();

    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,"0");

    h = h % 12 || 12;

    const t = `${h}:${m}`;

    document.getElementById("time").innerText = t;
    document.getElementById("nav").innerText = t;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
