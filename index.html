<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #00d2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: white;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; z-index: 1000; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000; transition: opacity 1s ease-in-out;
        }
        #splash h1 { font-weight: 100; font-size: 3rem; letter-spacing: 15px; margin-bottom: 30px; }
        #splash button { 
            padding: 12px 40px; background: none; border: 1px solid var(--border);
            color: white; border-radius: 50px; cursor: pointer; font-weight: 300;
            letter-spacing: 2px; transition: 0.3s; backdrop-filter: blur(10px);
        }
        #splash button:hover { background: white; color: black; box-shadow: 0 0 30px var(--accent); }

        /* --- INTRO VIDEO --- */
        #intro-vid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; z-index: 500; }

        /* --- DESKTOP --- */
        #desktop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a2a6c, #b21f1f, #fdbb2d); /* Elegant Sunset Gradient */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Bar */
        .status-bar {
            width: 100%; height: 30px; background: rgba(0,0,0,0.2);
            backdrop-filter: blur(20px); display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; font-size: 12px; font-weight: 500;
        }

        /* Clock */
        #clock-wrap { margin-top: 10vh; text-align: center; }
        #time { font-size: 7rem; font-weight: 200; letter-spacing: -3px; }
        #date { font-size: 1.2rem; font-weight: 300; opacity: 0.7; letter-spacing: 4px; }

        /* Icon Grid - Focused on 3 Items */
        .grid {
            margin-top: 60px; display: flex; gap: 60px;
        }

        .app {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-box {
            width: 100px; height: 100px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; position: relative; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            cursor: pointer; transition: 0.3s;
        }

        /* The Reflection Effect */
        .icon-box::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); transition: 0.6s;
        }

        .app:hover .icon-box { transform: scale(1.1) translateY(-10px); background: rgba(255,255,255,0.15); }
        .app:hover .icon-box::before { left: 100%; }
        .app span { font-size: 14px; font-weight: 400; opacity: 0.8; letter-spacing: 1px; }

        /* THE DOCK - Based on your image */
        .dock-container {
            position: absolute; bottom: 30px;
            padding: 10px 15px; border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .dock-item {
            width: 60px; height: 60px; border-radius: 16px;
            background: rgba(255,255,255,0.05); display: flex; align-items: center;
            justify-content: center; font-size: 2rem; transition: 0.3s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .dock-item:hover { transform: scale(1.4) translateY(-20px); background: rgba(255,255,255,0.2); margin: 0 10px; }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="boot()">BOOT SYSTEM</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="desktop">
        <div class="status-bar">
            <span> Orbital OS</span>
            <span id="nav-time">00:00</span>
        </div>

        <div id="clock-wrap">
            <div id="time">00:00</div>
            <div id="date">JANUARY 01</div>
        </div>

        <div class="grid">
            <div class="app">
                <div class="icon-box">🎮</div>
                <span>Arcade</span>
            </div>
            <div class="app">
                <div class="icon-box">🌐</div>
                <span>Proxy</span>
            </div>
            <div class="app">
                <div class="icon-box">⚙️</div>
                <span>Settings</span>
            </div>
        </div>

        <div class="dock-container">
            <div class="dock-item">🏠</div>
            <div class="dock-item">🧭</div>
            <div class="dock-item">📁</div>
        </div>
    </div>

    <script>
        function boot() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; 
                v.style.display = "block";
                v.muted = false;
                v.play();
            }, 1000);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const d = document.getElementById('desktop');
            v.style.transition = "opacity 1.5s";
            v.style.opacity = "0";
            d.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function tick() {
            const now = new Date();
            const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').innerText = t;
            document.getElementById('nav-time').innerText = t;
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();
        }
        setInterval(tick, 1000); tick();
    </script>
</body>
</html>
