<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --red-soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--red-soft);
    font-size:12px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.6);
}

/* ---------- VIDEO ---------- */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
    filter:grayscale(100%) contrast(1.2);
}

#skip{
    position:fixed;
    top:12px;
    right:12px;
    display:none;
    z-index:600;
    padding:8px 12px;
    background:#000;
    border:1px solid var(--red-soft);
    color:white;
    font-size:12px;
}

/* ---------- DESKTOP ---------- */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.8);
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    letter-spacing:-6px;
}

/* ---------- WINDOWS ---------- */
#apps{
    position:absolute;
    inset:0;
}

.window{
    position:absolute;
    width:380px;
    height:240px;
    background:rgba(10,10,10,0.95);
    border:1px solid var(--red-soft);
    display:flex;
    flex-direction:column;
}

.w-top{
    height:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid var(--red-soft);
    font-size:11px;
}

.close{
    cursor:pointer;
    color:var(--red);
}

.w-content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:rgba(255,255,255,0.6);
}

/* ---------- DOCK ---------- */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.75);
    border:1px solid var(--red-soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.dock-app svg{
    width:24px;
    height:24px;
    stroke:var(--red);
    fill:none;
    stroke-width:1.6;
}

/* ---------- FULLSCREEN NET ---------- */
#netApp{
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    z-index:2000;
}

/* net boot */
#netBoot{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    letter-spacing:18px;
    color:var(--red);
    animation:netBoot 1.2s ease forwards;
}

@keyframes netBoot{
    0%{opacity:0; transform:scale(0.9);}
    50%{opacity:1;}
    100%{opacity:0; transform:scale(1.1);}
}

/* net ui */
#netUI{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
}

#netTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--red-soft);
    font-size:12px;
}

#netBar{
    display:flex;
    gap:8px;
    padding:10px;
}

#netBar input{
    flex:1;
    background:#000;
    border:1px solid var(--red-soft);
    color:white;
    padding:8px;
    font-size:12px;
    outline:none;
}

#netBar button{
    background:#000;
    border:1px solid var(--red-soft);
    color:white;
    padding:8px 12px;
    cursor:pointer;
}

/* REAL BROWSER */
#netFrame{
    width:100%;
    height:100%;
    border:none;
    background:#000;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skip()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="apps"></div>

    <!-- DOCK -->
    <div id="dock">

        <div class="dock-app" onclick="openApp('Arcade')">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="6" width="16" height="12" rx="2"/>
                <path d="M8 10h.01M16 10h.01M9 14h6"/>
            </svg>
        </div>

        <div class="dock-app" onclick="openNet()">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3c3 4 3 14 0 18"/>
            </svg>
        </div>

        <div class="dock-app" onclick="openApp('System')">
            <svg viewBox="0 0 24 24">
                <path d="M12 2l3 6 7 .5-5 4 1.5 7L12 16l-6.5 3.5L7 12.5 2 8.5 9 8z"/>
            </svg>
        </div>

    </div>

</div>

<!-- FULL NET -->
<div id="netApp">

    <div id="netBoot">ORBITAL NET</div>

    <div id="netUI">

        <div id="netTop">
            <div>ORBITAL NET</div>
            <div onclick="closeNet()" style="cursor:pointer;color:#ff2a2a;">EXIT</div>
        </div>

        <div id="netBar">
            <input id="netUrl" placeholder="enter url (https://...)">
            <button onclick="loadNet()">GO</button>
        </div>

        <iframe id="netFrame"></iframe>

    </div>
</div>

<script>

let z=10;

/* BOOT */
let clicks=0;
document.getElementById("enter").onclick=()=>{
    clicks++;
    setTimeout(()=>clicks=0,400);
    if(clicks===2) start();
};

function start(){
    document.getElementById("boot").style.display="none";

    const v=document.getElementById("video");
    const skip=document.getElementById("skip");

    v.style.display="block";
    skip.style.display="block";

    v.play();
}

/* SKIP */
function skip(){
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* END VIDEO */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* APPS */
function openApp(name){
    const win=document.createElement("div");
    win.className="window";
    win.style.left="200px";
    win.style.top="150px";
    win.style.zIndex=++z;

    win.innerHTML=`
        <div class="w-top">
            <div>${name}</div>
            <div class="close" onclick="this.parentElement.parentElement.remove()">✕</div>
        </div>
        <div class="w-content">${name} APP</div>
    `;

    document.getElementById("apps").appendChild(win);
}

/* NET OPEN */
function openNet(){
    document.getElementById("netApp").style.display="block";
    document.getElementById("desktop").style.opacity="0";

    const boot=document.getElementById("netBoot");
    const ui=document.getElementById("netUI");

    boot.style.display="flex";
    ui.style.display="none";

    setTimeout(()=>{
        boot.style.display="none";
        ui.style.display="flex";
    },1200);
}

function closeNet(){
    document.getElementById("netApp").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* REAL BROWSER */
function loadNet(){
    let url=document.getElementById("netUrl").value;
    const frame=document.getElementById("netFrame");

    if(!url) return;

    if(!url.startsWith("http")){
        url="https://"+url;
    }

    frame.src=url;
}

/* CLOCK */
function tick(){
    const now=new Date();
    let h=now.getHours();
    const m=now.getMinutes().toString().padStart(2,"0");
    h=h%12||12;

    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
