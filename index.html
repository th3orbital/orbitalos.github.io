<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS | Monochrome</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-main);
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; z-index: 1000; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000; transition: opacity 1s ease-in-out;
        }
        #splash h1 { font-weight: 100; font-size: 3rem; letter-spacing: 15px; margin-bottom: 30px; color: white; }
        #splash button { 
            padding: 12px 40px; background: none; border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 50px; cursor: pointer; font-weight: 300;
            letter-spacing: 2px; transition: 0.3s; backdrop-filter: blur(10px);
        }
        #splash button:hover { background: white; color: black; }

        /* --- INTRO VIDEO --- */
        #intro-vid { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            object-fit: cover; display: none; z-index: 500; 
            filter: grayscale(100%); /* Force video to be Black & White */
        }

        /* --- DESKTOP --- */
        #desktop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Deep Black to Dark Grey Radial */
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        .status-bar {
            width: 100%; height: 30px; background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px); display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; font-size: 12px; font-weight: 400;
            border-bottom: 0.5px solid var(--border);
        }

        #clock-wrap { margin-top: 10vh; text-align: center; }
        #time { font-size: 8rem; font-weight: 100; letter-spacing: -4px; color: white; }
        #date { font-size: 1.1rem; font-weight: 300; color: var(--text-dim); letter-spacing: 5px; text-transform: uppercase; }

        /* Icon Grid */
        .grid { margin-top: 60px; display: flex; gap: 70px; }
        .app { display: flex; flex-direction: column; align-items: center; gap: 15px; }

        .icon-box {
            width: 110px; height: 110px;
            background: var(--glass);
            backdrop-filter: blur(30px) grayscale(100%);
            border: 1px solid var(--border);
            border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; filter: grayscale(100%); /* Greyscale Emojis */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .app:hover .icon-box { 
            transform: scale(1.1) translateY(-10px); 
            background: rgba(255,255,255,0.12); 
            border-color: rgba(255,255,255,0.4);
            filter: grayscale(0%); /* Color pops back on hover for a cool effect */
        }
        
        .app span { font-size: 13px; font-weight: 300; color: var(--text-dim); letter-spacing: 1px; }

        /* THE DOCK */
        .dock-container {
            position: absolute; bottom: 30px;
            padding: 10px 15px; border-radius: 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            display: flex; gap: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        .dock-item {
            width: 58px; height: 58px; border-radius: 16px;
            background: rgba(255,255,255,0.03); display: flex; align-items: center;
            justify-content: center; font-size: 1.8rem; filter: grayscale(100%);
            transition: 0.3s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .dock-item:hover { transform: scale(1.4) translateY(-20px); filter: grayscale(0%); background: rgba(255,255,255,0.1); margin: 0 10px; }

    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="boot()">BOOT SYSTEM</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="desktop">
        <div class="status-bar">
            <span> Orbital OS</span>
            <span id="nav-time">0:00 AM</span>
        </div>

        <div id="clock-wrap">
            <div id="time">0:00</div>
            <div id="date">JANUARY 01</div>
        </div>

        <div class="grid">
            <div class="app"><div class="icon-box">🎮</div><span>Arcade</span></div>
            <div class="app"><div class="icon-box">🌐</div><span>Proxy</span></div>
            <div class="app"><div class="icon-box">⚙️</div><span>Settings</span></div>
        </div>

        <div class="dock-container">
            <div class="dock-item">🏠</div>
            <div class="dock-item">🧭</div>
            <div class="dock-item">📁</div>
        </div>
    </div>

    <script>
        function boot() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; 
                v.style.display = "block";
                v.muted = false;
                v.play();
            }, 1000);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const d = document.getElementById('desktop');
            v.style.transition = "opacity 1.5s";
            v.style.opacity = "0";
            d.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function tick() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeStr = hours + ":" + minutes;
            document.getElementById('time').innerText = timeStr;
            document.getElementById('nav-time').innerText = timeStr + " " + ampm;
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}).toUpperCase();
        }
        setInterval(tick, 1000); tick();
    </script>
</body>
</html>
