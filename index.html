<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root {
    --bg: #050505;
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.12);
    --accent: #4da3ff;
    --glow: rgba(77,163,255,0.35);
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body {
    background: radial-gradient(circle at 50% 30%, #111 0%, #050505 40%, #000 100%);
    height:100vh;
    overflow:hidden;
    color:white;
}

/* ambient glow */
.ambient {
    position:fixed;
    width:700px;
    height:700px;
    background: radial-gradient(circle, var(--glow), transparent 70%);
    top:20%;
    left:50%;
    transform:translateX(-50%);
    filter:blur(120px);
    opacity:.25;
}

/* splash */
#splash {
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
    transition:1s;
}

#splash h1 {
    font-weight:100;
    letter-spacing:20px;
    font-size:3rem;
    opacity:.6;
}

#bootBtn {
    margin-top:40px;
    padding:12px 40px;
    border:1px solid var(--border);
    background:none;
    color:white;
    letter-spacing:4px;
    cursor:pointer;
    transition:.4s;
}

#bootBtn:hover {
    background:white;
    color:black;
}

/* desktop */
#desktop {
    opacity:0;
    transition:2s;
    height:100%;
}

/* top bar */
.topbar {
    height:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(40px);
    border-bottom:1px solid var(--border);
    font-size:13px;
}

/* clock */
.clock {
    position:absolute;
    top:18%;
    width:100%;
    text-align:center;
}

#time {
    font-size:8rem;
    font-weight:100;
    text-shadow:0 0 30px rgba(255,255,255,.1),0 0 60px var(--glow);
}

#date {
    margin-top:10px;
    font-size:1rem;
    opacity:.5;
    letter-spacing:6px;
}

/* apps */
.apps {
    position:absolute;
    top:45%;
    width:100%;
    display:flex;
    justify-content:center;
    gap:70px;
}

.app {
    text-align:center;
    cursor:pointer;
}

.icon {
    width:110px;
    height:110px;
    border-radius:30px;
    background:var(--glass);
    backdrop-filter:blur(40px);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3rem;
    transition:.4s;
}

.app:hover .icon {
    transform:translateY(-12px) scale(1.1);
    border-color:var(--accent);
    box-shadow:0 0 25px var(--glow);
}

/* dock */
.dock {
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:18px;
    padding:12px 18px;
    border-radius:30px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(50px);
    border:1px solid var(--border);
}

.dock-item {
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    font-size:1.8rem;
    transition:.25s;
}

.dock-item:hover {
    transform:scale(1.3) translateY(-10px);
    background:rgba(255,255,255,.1);
}

/* window system */
.window {
    position:absolute;
    top:100px;
    left:100px;
    width:400px;
    height:300px;
    background:rgba(20,20,20,.9);
    backdrop-filter:blur(30px);
    border:1px solid var(--border);
    border-radius:20px;
    display:none;
    flex-direction:column;
}

.window-header {
    padding:10px;
    border-bottom:1px solid var(--border);
    cursor:move;
    font-size:13px;
}

.window-content {
    padding:15px;
    font-size:14px;
    opacity:.8;
}

</style>
</head>

<body>

<div class="ambient"></div>

<div id="splash">
    <h1>ORBITAL</h1>
    <button id="bootBtn" onclick="boot()">BOOT</button>
</div>

<div id="desktop">
    <div class="topbar">
        <div>Orbital OS</div>
        <div id="navTime"></div>
    </div>

    <div class="clock">
        <div id="time"></div>
        <div id="date"></div>
    </div>

    <div class="apps">
        <div class="app" onclick="openWindow('arcade')">
            <div class="icon">🎮</div>
            <div>Arcade</div>
        </div>
        <div class="app" onclick="openWindow('browser')">
            <div class="icon">🌐</div>
            <div>Browser</div>
        </div>
        <div class="app" onclick="openWindow('settings')">
            <div class="icon">⚙️</div>
            <div>Settings</div>
        </div>
    </div>

    <div class="dock">
        <div class="dock-item">🏠</div>
        <div class="dock-item">📂</div>
        <div class="dock-item">🧭</div>
    </div>
</div>

<!-- windows -->
<div id="arcade" class="window">
    <div class="window-header">Arcade</div>
    <div class="window-content">Game launcher coming soon...</div>
</div>

<div id="browser" class="window">
    <div class="window-header">Browser</div>
    <div class="window-content">Your proxy/browser system goes here.</div>
</div>

<div id="settings" class="window">
    <div class="window-header">Settings</div>
    <div class="window-content">Theme, audio, system options.</div>
</div>

<script>

/* boot */
function boot() {
    document.getElementById("splash").style.opacity = "0";
    setTimeout(()=>{
        document.getElementById("splash").style.display="none";
        document.getElementById("desktop").style.opacity="1";
    },1000);
}

/* clock */
function updateClock(){
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes().toString().padStart(2,'0');
    let ampm = h>=12?"PM":"AM";
    h = h%12 || 12;

    document.getElementById("time").innerText = `${h}:${m}`;
    document.getElementById("navTime").innerText = `${h}:${m} ${ampm}`;
    document.getElementById("date").innerText =
        now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
}
setInterval(updateClock,1000);
updateClock();

/* windows */
function openWindow(id){
    const w = document.getElementById(id);
    w.style.display = "flex";
}

/* drag */
document.querySelectorAll(".window").forEach(win=>{
    let offsetX, offsetY, dragging=false;

    const header = win.querySelector(".window-header");

    header.onmousedown = (e)=>{
        dragging=true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
    };

    document.onmouseup = ()=> dragging=false;

    document.onmousemove = (e)=>{
        if(dragging){
            win.style.left = (e.clientX - offsetX) + "px";
            win.style.top = (e.clientY - offsetY) + "px";
        }
    };
});

</script>

</body>
</html>
