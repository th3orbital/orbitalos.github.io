<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
  --main:#a855f7;
  --bg:#05010a;
  --glass:rgba(20,10,40,0.6);
  --border:rgba(168,85,247,0.3);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:var(--bg);
  color:white;
  overflow:hidden;
}

/* SCREENS */
.screen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DISCLAIMER */
#disclaimer{
  background:black;
  flex-direction:column;
  text-align:center;
}

#disclaimer button{
  margin-top:20px;
  padding:10px 20px;
  border:1px solid var(--border);
  background:none;
  color:var(--main);
  cursor:pointer;
}

/* BOOT */
#boot{
  display:none;
  flex-direction:column;
}

#boot h1{
  letter-spacing:20px;
  color:var(--main);
}

#boot button{
  margin-top:30px;
  padding:12px 30px;
  border:1px solid var(--border);
  background:none;
  color:var(--main);
  cursor:pointer;
}

/* VIDEO */
#videoScreen{
  display:none;
  background:black;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

#skip{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  color:var(--main);
  font-size:12px;
  opacity:0.7;
}

/* DESKTOP */
#desktop{
  display:none;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:34px;
  display:flex;
  justify-content:space-between;
  padding:0 12px;
  background:var(--glass);
  border-bottom:1px solid var(--border);
  align-items:center;
}

/* CLOCK */
#clock{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:80px;
  color:var(--main);
}

/* DOCK */
.dock{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  padding:10px 20px;
  background:var(--glass);
  border:1px solid var(--border);
  border-radius:20px;
}

.app{
  width:50px;
  height:50px;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- DISCLAIMER -->
<div id="disclaimer" class="screen">
  <div>
    <p>This site could be blocked at any time.</p>
    <p>Use at your own risk.</p>
    <button id="accept">ENTER</button>
  </div>
</div>

<!-- BOOT -->
<div id="boot" class="screen">
  <h1>ORBITAL</h1>
  <button id="start">START</button>
</div>

<!-- VIDEO -->
<div id="videoScreen" class="screen">
  <video id="intro" muted>
    <source src="video.mp4" type="video/mp4">
  </video>
  <div id="skip">Press ENTER twice to skip</div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="screen">

  <div class="topbar">
    <div>ORBITAL</div>
    <div id="topClock"></div>
  </div>

  <div id="clock"></div>

  <div class="dock">
    <div class="app">◎</div>
  </div>

</div>

<script>
const disclaimer = document.getElementById("disclaimer");
const boot = document.getElementById("boot");
const videoScreen = document.getElementById("videoScreen");
const desktop = document.getElementById("desktop");
const video = document.getElementById("intro");

document.getElementById("accept").onclick = () => {
  disclaimer.style.display="none";
  boot.style.display="flex";
};

document.getElementById("start").onclick = () => {
  boot.style.display="none";
  videoScreen.style.display="flex";
  video.play();
};

/* SKIP SYSTEM */
let count = 0;
document.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    count++;
    setTimeout(()=>count=0,400);
    if(count===2) finish();
  }
});

/* VIDEO END */
video.onended = finish;

function finish(){
  video.pause();
  videoScreen.style.display="none";
  desktop.style.display="flex";
}

/* CLOCK */
function updateTime(){
  const d=new Date();
  let h=d.getHours()%12||12;
  let m=d.getMinutes().toString().padStart(2,"0");
  document.getElementById("clock").innerText=`${h}:${m}`;
  document.getElementById("topClock").innerText=`${h}:${m}`;
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
