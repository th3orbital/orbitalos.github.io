<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --main:#a855f7;
    --accent:#6d28d9;
    --soft:rgba(168,85,247,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ⚠️ DISCLAIMER */
#disclaimer{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.9);
    z-index:9999;
}

.discBox{
    width:340px;
    padding:20px;
    border:1px solid var(--soft);
    background:rgba(0,0,0,0.8);
    backdrop-filter: blur(14px);
    text-align:center;
    color:var(--main);
}

.discBox button{
    margin-top:14px;
    padding:10px 16px;
    background:transparent;
    border:1px solid var(--soft);
    color:var(--main);
    cursor:pointer;
}

/* BOOT */
#boot{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000;
}

#boot h1{
    letter-spacing:20px;
    color:var(--main);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    cursor:pointer;
}

/* VIDEO */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:500;
}

/* SKIP TEXT */
#skip{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:12px;
    color:var(--main);
    opacity:0.7;
    display:none;
}

/* DESKTOP */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOPBAR */
.topbar{
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.6);
    border-bottom:1px solid var(--soft);
    color:var(--main);
}

/* CLOCK */
#time{
    position:absolute;
    top:30%;
    width:100%;
    text-align:center;
    font-size:9rem;
    color:var(--main);
}
</style>
</head>

<body>

<div id="disclaimer">
    <div class="discBox">
        <p>
            This site could be blocked at any time.<br><br>
            Use at your own risk.
        </p>
        <button onclick="accept()">ENTER</button>
    </div>
</div>

<div id="boot">
    <h1>ORBITAL</h1>
    <div id="enter">START</div>
</div>

<video id="video" muted playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div id="skip">PRESS ENTER TWICE TO SKIP</div>

<div id="desktop">
    <div class="topbar">
        <div>ORBITAL</div>
        <div id="nav"></div>
    </div>

    <div id="time"></div>
</div>

<script>

/* ACCEPT */
function accept(){
    disclaimer.style.display="none";
    boot.style.display="flex";
}

/* START */
enter.onclick=()=>{
    boot.style.display="none";

    video.style.display="block";
    skip.style.display="block";
    video.play();
};

/* DOUBLE ENTER SKIP */
let press=0;
document.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
        press++;
        setTimeout(()=>press=0,400);

        if(press===2){
            endVideo();
        }
    }
});

/* VIDEO END */
video.onended=endVideo;

function endVideo(){
    video.pause();
    video.style.display="none";
    skip.style.display="none";
    desktop.style.opacity="1";
}

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");
    time.innerText=`${h}:${m}`;
    nav.innerText=`${h}:${m}`;
}
setInterval(tick,1000);
tick();

</script>

</body>
</html>
