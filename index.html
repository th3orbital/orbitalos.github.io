<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital OS</title>

<style>
:root{
    --red:#ff2a2a;
    --soft:rgba(255,42,42,0.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    user-select:none;
}

body{
    height:100vh;
    overflow:hidden;
    background:#000;
    color:white;
}

/* ---------- BOOT ---------- */
#boot{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:1000;
}

#boot h1{
    font-weight:100;
    letter-spacing:28px;
    font-size:3rem;
    color:var(--red);
}

#enter{
    margin-top:40px;
    padding:14px 40px;
    border:1px solid var(--soft);
    font-size:12px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.6);
}

/* ---------- VIDEO ---------- */
#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    filter:grayscale(100%) contrast(1.2);
    z-index:500;
}

#skip{
    position:fixed;
    top:12px;
    right:12px;
    display:none;
    z-index:600;
    padding:8px 12px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
    font-size:12px;
}

/* ---------- DESKTOP ---------- */
#desktop{
    position:fixed;
    inset:0;
    opacity:0;
    transition:1s;
}

/* TOP BAR */
.topbar{
    position:absolute;
    top:0;
    width:100%;
    height:34px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    background:rgba(0,0,0,0.8);
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

/* CLOCK */
#time{
    position:absolute;
    top:28%;
    width:100%;
    text-align:center;
    font-size:9rem;
    font-weight:100;
    letter-spacing:-6px;
}

/* ---------- DOCK ---------- */
#dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.75);
    border:1px solid var(--soft);
}

.dock-app{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

/* ---------- PROXY SYSTEM ---------- */
#proxyApp{
    position:fixed;
    inset:0;
    display:none;
    background:#000;
    z-index:2000;
}

#proxyTop{
    height:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--soft);
    font-size:12px;
}

#proxyBar{
    display:flex;
    gap:8px;
    padding:10px;
}

#proxyBar input{
    flex:1;
    padding:8px;
    background:#000;
    border:1px solid var(--soft);
    color:white;
    outline:none;
}

#proxyBar button{
    background:#000;
    border:1px solid var(--soft);
    color:white;
    padding:8px 12px;
    cursor:pointer;
}

#proxyFrame{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
    <h1>ORBITAL OS</h1>
    <div id="enter">DOUBLE CLICK TO ENTER SYSTEM</div>
</div>

<!-- VIDEO -->
<video id="video">
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip" onclick="skip()">SKIP</button>

<!-- DESKTOP -->
<div id="desktop">

    <div class="topbar">
        <div>ORBITAL OS</div>
        <div id="nav"></div>
    </div>

    <div id="time">0:00</div>

    <div id="dock">
        <div class="dock-app" onclick="openProxy()">🌐</div>
        <div class="dock-app" onclick="openApp()">⚙️</div>
    </div>

</div>

<!-- ORBITAL'S PROXY -->
<div id="proxyApp">

    <div id="proxyTop">
        <div>ORBITAL'S PROXY</div>
        <div onclick="closeProxy()" style="cursor:pointer;color:#ff2a2a;">EXIT</div>
    </div>

    <div id="proxyBar">
        <input id="proxyUrl" placeholder="Search Google or enter URL">
        <button onclick="goProxy()">GO</button>
    </div>

    <iframe id="proxyFrame"></iframe>

</div>

<script>

let clicks=0;

/* BOOT */
document.getElementById("enter").onclick=()=>{
    clicks++;
    setTimeout(()=>clicks=0,400);
    if(clicks===2) start();
};

function start(){
    document.getElementById("boot").style.display="none";

    const v=document.getElementById("video");
    const skip=document.getElementById("skip");

    v.style.display="block";
    skip.style.display="block";

    v.play();
}

/* SKIP */
function skip(){
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* END VIDEO */
document.getElementById("video").onended=()=>{
    document.getElementById("video").style.display="none";
    document.getElementById("skip").style.display="none";
    document.getElementById("desktop").style.opacity="1";
};

/* APP */
function openApp(){
    alert("System placeholder");
}

/* OPEN PROXY */
function openProxy(){
    document.getElementById("proxyApp").style.display="block";
    document.getElementById("desktop").style.opacity="0";
    document.getElementById("proxyFrame").src="https://www.google.com";
}

/* CLOSE PROXY */
function closeProxy(){
    document.getElementById("proxyApp").style.display="none";
    document.getElementById("desktop").style.opacity="1";
}

/* GOOGLE NAV */
function goProxy(){
    let q=document.getElementById("proxyUrl").value;
    let frame=document.getElementById("proxyFrame");

    if(!q){
        frame.src="https://www.google.com";
        return;
    }

    if(!q.includes(".") && !q.startsWith("http")){
        frame.src="https://www.google.com/search?q="+encodeURIComponent(q);
    } else {
        frame.src=q.startsWith("http")?q:"https://"+q;
    }
}

/* CLOCK */
function tick(){
    let d=new Date();
    let h=d.getHours()%12||12;
    let m=d.getMinutes().toString().padStart(2,"0");

    document.getElementById("time").innerText=`${h}:${m}`;
    document.getElementById("nav").innerText=`${h}:${m}`;
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
