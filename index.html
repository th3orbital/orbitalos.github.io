<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital OS | Ultimate</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent: #00f2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: default; user-select: none; }
        
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: white;
        }

        /* --- 1. BOOT SEQUENCE --- */
        #splash {
            position: fixed; z-index: 1000; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #000; transition: opacity 1.5s ease-in-out;
        }
        #splash h1 { font-weight: 100; font-size: 3.5rem; letter-spacing: 20px; color: white; margin-bottom: 40px; }
        #splash button { 
            padding: 14px 45px; background: none; border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 50px; cursor: pointer; font-weight: 300;
            letter-spacing: 2px; transition: 0.4s; backdrop-filter: blur(10px);
        }
        #splash button:hover { background: white; color: black; box-shadow: 0 0 40px rgba(255,255,255,0.3); }

        /* --- 2. THE VIDEO --- */
        #intro-vid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; display: none; z-index: 500; }

        /* --- 3. THE DESKTOP --- */
        #desktop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #1e2a4a, #000);
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; z-index: 100; transition: opacity 2s ease;
        }

        /* Ambient Light Blobs */
        .glow {
            position: absolute; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.05) 0%, transparent 70%);
            top: -200px; right: -200px; pointer-events: none;
        }

        /* Menu Bar */
        .top-nav {
            width: 100%; height: 35px; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(30px); border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; font-size: 13px; font-weight: 500;
        }

        /* Clock Content */
        #hero-clock { margin-top: 8vh; text-align: center; pointer-events: none; }
        #time { font-size: 8rem; font-weight: 200; letter-spacing: -4px; color: rgba(255,255,255,0.9); }
        #date { font-size: 1.4rem; font-weight: 300; opacity: 0.6; letter-spacing: 3px; margin-top: -10px; }

        /* Icon Grid */
        .grid { margin-top: 60px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 45px; }
        .app-card { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .app-btn {
            width: 90px; height: 90px; background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; transition: 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.28);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); cursor: pointer;
        }
        .app-btn:hover { transform: scale(1.1) translateY(-10px); background: rgba(255,255,255,0.15); }
        .app-card span { font-size: 13px; font-weight: 400; opacity: 0.8; }

        /* The Dock */
        .dock {
            position: absolute; bottom: 25px; padding: 12px;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            display: flex; gap: 15px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .dock-item {
            width: 60px; height: 60px; border-radius: 16px;
            background: rgba(255,255,255,0.05); display: flex; align-items: center;
            justify-content: center; font-size: 2rem; transition: 0.3s; cursor: pointer;
        }
        .dock-item:hover { transform: scale(1.4) translateY(-15px); background: rgba(255,255,255,0.15); margin: 0 10px; }

        /* The Window System */
        #game-window {
            position: absolute; width: 80%; height: 70%;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            z-index: 800; display: none; flex-direction: column;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .win-header { padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); }
        .close-btn { width: 15px; height: 15px; background: #ff5f56; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="splash">
        <h1>ORBITAL</h1>
        <button onclick="boot()">BOOT SYSTEM</button>
    </div>

    <video id="intro-vid"><source src="video.mp4" type="video/mp4"></video>

    <div id="desktop">
        <div class="glow"></div>
        <div class="top-nav">
            <div> Orbital OS</div>
            <div id="nav-time">00:00</div>
        </div>

        <div id="hero-clock">
            <div id="time">00:00</div>
            <div id="date">JANUARY 01</div>
        </div>

        <div class="grid">
            <div class="app-card" onclick="openWindow()">
                <div class="app-btn">🎮</div>
                <span>Arcade</span>
            </div>
            <div class="app-card"><div class="app-btn">🌐</div><span>Explorer</span></div>
            <div class="app-card"><div class="app-btn">🛠️</div><span>Terminal</span></div>
            <div class="app-card"><div class="app-btn">⚙️</div><span>Settings</span></div>
        </div>

        <div id="game-window">
            <div class="win-header">
                <div class="close-btn" onclick="closeWindow()"></div>
                <span>Arcade Mode</span>
                <div style="width:15px"></div>
            </div>
            <div style="padding: 20px; text-align: center;">
                <h2>Games Coming Soon</h2>
                <p style="opacity: 0.5; margin-top: 10px;">The Orbital Core is initializing...</p>
            </div>
        </div>

        <div class="dock">
            <div class="dock-item">🏠</div>
            <div class="dock-item">🧭</div>
            <div class="dock-item">📂</div>
            <div class="dock-item">✉️</div>
        </div>
    </div>

    <script>
        function boot() {
            const s = document.getElementById('splash');
            const v = document.getElementById('intro-vid');
            s.style.opacity = "0";
            setTimeout(() => { 
                s.style.display = "none"; v.style.display = "block";
                v.muted = false; v.play();
            }, 1000);
        }

        document.getElementById('intro-vid').onended = function() {
            const v = document.getElementById('intro-vid');
            const d = document.getElementById('desktop');
            v.style.transition = "opacity 1.5s"; v.style.opacity = "0";
            d.style.opacity = "1";
            setTimeout(() => { v.style.display = "none"; }, 1500);
        }

        function openWindow() { document.getElementById('game-window').style.display = "flex"; }
        function closeWindow() { document.getElementById('game-window').style.display = "none"; }

        function tick() {
            const now = new Date();
            const t = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('time').innerText = t;
            document.getElementById('nav-time').innerText = t;
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {month:'long', day:'numeric'}).toUpperCase();
        }
        setInterval(tick, 1000); tick();
    </script>
</body>
</html>
